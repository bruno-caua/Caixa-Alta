:root[data-theme=l] body.boss{background:#f6ded8}
.ft{text-shadow:0 2px 0 color-mix(in srgb,var(--bg) 80%,transparent)}
.tl.ra:not(.gd):not(.rb):not(.cr){background:linear-gradient(160deg,#f0e8ff,#b794f6);color:#1b0c36;box-shadow:0 3px 0 #6b49b8}
.tl.hl.rr{animation:spinr .6s cubic-bezier(.2,.8,.2,1);box-shadow:0 3px 0 #6b49b8,0 0 26px var(--ex)}
@keyframes spinr{from{rotate:-220deg;scale:.4}}
.tray.flip{animation:flipx .5s ease-in-out}@keyframes flipx{50%{transform:scaleX(-1)}}
.ring{position:fixed;z-index:44;width:22px;height:22px;border:3px solid var(--rc);border-radius:50%;pointer-events:none;translate:-50% -50%;animation:ringo .8s ease-out both}
@keyframes ringo{from{scale:.3;opacity:1}to{scale:14;opacity:0;border-width:1px}}
.sc{position:fixed;left:0;right:0;top:34%;z-index:61;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px;animation:slam 1.8s both}
.sn{font:clamp(54px,19vw,96px)/1 'Alfa Slab One',Georgia,serif;color:var(--tx);text-shadow:5px 5px 0 var(--ca),-3px -3px 0 color-mix(in srgb,var(--ex) 75%,transparent);letter-spacing:.01em}
.sc.t1 .sn{font-size:clamp(38px,13vw,62px);text-shadow:3px 3px 0 var(--ca)}
.sc.t3 .sn{text-shadow:5px 5px 0 var(--ex),-3px -3px 0 var(--ca)}
.sl{font:600 11px 'Chivo Mono',ui-monospace,monospace;letter-spacing:.4em;background:var(--tx);color:var(--bg);padding:3px 10px 3px 14px}
@keyframes slam{0%{opacity:0;scale:2.5;rotate:-9deg;filter:blur(7px)}11%{opacity:1;scale:.9;rotate:-2deg;filter:none}20%{scale:1.06}30%{scale:1;rotate:-2deg}78%{opacity:1}100%{opacity:0;translate:0 -46px;scale:1.04}}
.btns{grid-template-columns:1.4fr 1fr 1.3fr 1fr}
.btn.dk2{position:relative;border-color:var(--ex);color:var(--ex);letter-spacing:.06em;font-size:9.5px}
.dk2::before{content:"";display:inline-block;width:8px;height:11px;border:1.5px solid currentColor;border-radius:2px;margin-right:8px;box-shadow:3px 3px 0 -1px var(--bg),3px 3px 0 0 currentColor;vertical-align:-2px}
.dk2 .cnt{position:absolute;top:-8px;right:-5px;min-width:20px;height:20px;border-radius:99px;background:var(--ex);color:#140a26;font:700 10px 'Chivo Mono',monospace;display:grid;place-items:center;letter-spacing:0;padding:0 5px}
.dvw{position:fixed;inset:0;z-index:70;overflow-y:auto;padding:max(16px,env(safe-area-inset-top)) 14px max(20px,env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:dvin .3s ease-out}
@keyframes dvin{from{opacity:0}}
.dvh{display:flex;justify-content:space-between;align-items:flex-end;max-width:480px;margin:0 auto 12px;font-size:12px;color:var(--mu)}
.dvh small{display:block;font:500 9px 'Chivo Mono',monospace;letter-spacing:.3em;margin-bottom:4px}
.dvh b{font:700 42px/1 'Alfa Slab One',Georgia,serif;color:var(--tx);margin-right:10px;vertical-align:-4px}
.dvs{display:flex;gap:6px;flex-wrap:wrap;max-width:480px;margin:0 auto 22px;font-size:10px;color:var(--mu)}
.dvs span{border:1px solid var(--ln);border-radius:99px;padding:3px 10px}
.dvg{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:20px 12px;max-width:480px;margin:0 auto;padding:0 8px}
.cdk{--ps2:var(--ps);position:relative;aspect-ratio:3/4;border-radius:7px;background:var(--pp);color:var(--pk);display:grid;place-items:center;rotate:var(--a);animation:dealc .5s cubic-bezier(.2,.9,.3,1.2) backwards;animation-delay:calc(var(--i)*28ms);box-shadow:0 0 0 1px var(--ps)}
.cdk.s1{box-shadow:0 0 0 1px var(--ps),3px 3px 0 0 var(--pp),3px 3px 0 1px var(--ps)}
.cdk.s2{box-shadow:0 0 0 1px var(--ps),3px 3px 0 0 var(--pp),3px 3px 0 1px var(--ps),6px 6px 0 0 var(--pp),6px 6px 0 1px var(--ps)}
.cdk.s3{box-shadow:0 0 0 1px var(--ps),3px 3px 0 0 var(--pp),3px 3px 0 1px var(--ps),6px 6px 0 0 var(--pp),6px 6px 0 1px var(--ps),9px 9px 0 0 var(--pp),9px 9px 0 1px var(--ps)}
.cdk.ra{background:linear-gradient(160deg,#f0e8ff,#b794f6);color:#1b0c36;--ps:#6b49b8}
.cdk.ug{background:linear-gradient(160deg,#ffffff,#d6dbe1);color:#14161a;--ps:#9aa0a6;filter:drop-shadow(0 0 7px var(--gg))}
.cdk.ur{background:linear-gradient(160deg,#ff9a78,#e2431f);color:#fff;--ps:#a8321b}
.cdk.uk{background:linear-gradient(160deg,#ffe08a,#ffb21f);color:#1a1200;--ps:#a8730c}
.cdk.z{opacity:.25;filter:grayscale(1)}
.cdk[data-l]{cursor:pointer}
.dvg.nd .cdk{animation:none}
.cdk.gh{position:absolute;margin:0;pointer-events:none;z-index:5;animation:none}
.cdk b{font:700 32px/1 'Alfa Slab One',Georgia,serif}
.cdk i{position:absolute;left:6px;top:4px;font:700 9px 'Chivo Mono',monospace;font-style:normal}
.cdk i.b{left:auto;top:auto;right:6px;bottom:4px;rotate:180deg}
.cdk .n{position:absolute;bottom:-10px;left:50%;translate:-50% 0;background:var(--tx);color:var(--bg);font:700 10px 'Chivo Mono',monospace;padding:1px 7px;border-radius:99px;z-index:2}
.cdk .u{position:absolute;top:-4px;right:-4px;display:flex;gap:2px;z-index:2}
.cdk .u em{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--bg)}
.dg{background:var(--ti)}.dr{background:var(--ca)}.dx{background:var(--mx)}
@keyframes dealc{from{opacity:0;translate:0 50px;scale:.6;rotate:24deg}}
.dvf{max-width:380px;margin:30px auto 0;text-align:center;font-size:10px;line-height:1.5;color:var(--mu)}

@media(max-width:390px){
 .hdr{gap:8px}
 .ed{font-size:30px}
 .gt{font-size:9px;letter-spacing:.12em}
 .stats .st{font-size:15px}
 .btns{gap:4px}
 .btn{font-size:9px;letter-spacing:.06em;padding-inline:2px}
 .eq{gap:10px}
}
@media(max-height:700px) and (max-width:600px){
 .rs{--rh:60px}
 .rs .art{--af:22px}
 .rs small{height:14px;font-size:7px}
 #app{gap:6px;padding-top:max(6px,env(safe-area-inset-top));padding-bottom:max(6px,env(safe-area-inset-bottom))}
 .key{padding-bottom:3px}
 .key b{margin-bottom:5px}
 .board{gap:5px;padding:2px 0}
 /* Mantém a mão flexível também em telas baixas, para os controles
    continuarem alinhados ao fim da área útil como nos outros celulares. */
 .handw{flex:1}
 .pt b{font-size:27px}
 .btn{height:42px}
}

/* Ajustes pontuais: mesma moldura de raridade na loja, na partida e nos poderes comprados. */

/* Moldura clara com dupla linha e acento da raridade aplicada às três áreas. */
.shop .cd:not(.empty),.rs.on{
  --q:#a6a69f;--ink:#25282b;--ink2:#62656a;--pg:#24784f;--pap:#fff;
  position:relative;isolation:isolate;background:#fff!important;color:#25282b;
  border:1px solid #d9d9d4;border-radius:8px;
  box-shadow:inset 0 3px 0 var(--q),0 3px 8px #0002;
}
.shop .cd.q0,.rs.on.q0{--q:#a6a69f;border-color:#d9d9d4}
.shop .cd.q1,.rs.on.q1{--q:#4785ba;border-color:#8db8d7;box-shadow:inset 0 3px 0 #4785ba,0 3px 8px #0002}
.shop .cd.q2,.rs.on.q2{--q:#8b6ac2;border-color:#b7a4d8;background:#fff!important;box-shadow:inset 0 3px 0 #8b6ac2,0 3px 8px #0002}
.shop .cd:not(.empty)::before,.rs.on::before{
  inset:4px;border:1px solid color-mix(in srgb,var(--q) 38%,#fff);
  border-radius:5px;pointer-events:none
}
.shop .cd.q1::before,.rs.on.q1::before{border-color:#d4e5f1}
.shop .cd.q2::before,.rs.on.q2::before{border-color:#e4daf2}

/* Fundos opacos dos botões de ação: vermelho, roxo e cinza, mantendo as cores atuais. */
.btn.dc{background:var(--ca);color:#fff;border-color:var(--ca);box-shadow:0 3px 0 color-mix(in srgb,var(--ca) 68%,#000)}
.btn.dk2{background:var(--ex);color:#170d29;border-color:var(--ex);box-shadow:0 3px 0 color-mix(in srgb,var(--ex) 65%,#000)}
.btn.dk2::before{border-color:#170d29;box-shadow:3px 3px 0 -1px var(--ex),3px 3px 0 0 #170d29}
.btn.dk2 .cnt{background:var(--bg);color:var(--ex);border:1px solid var(--bg)}
.btn[data-a="clr"]{background:#d9d3c5;color:#191812;border-color:#eee8da;box-shadow:0 3px 0 #8b8373}.btn[data-a="clr"]:hover{filter:brightness(1.06)}.btn[data-a="clr"]:focus-visible{outline:2px solid var(--mx);outline-offset:3px}
:root[data-theme=l] .btn[data-a="clr"]{background:#d2cbbb;color:#242117;border-color:#b6ad9a;box-shadow:0 3px 0 #a39a87}
:root[data-theme=l] .btn.dk2{color:#fff}


/* ================= LOJA (layout compacto: poderes comprados no topo, vitrine com botões ao lado) ================= */
.shop{--pn:color-mix(in srgb,var(--tx) 5%,var(--bg));--well:color-mix(in srgb,var(--bg) 78%,#000);--edge:color-mix(in srgb,var(--tx) 14%,var(--bg));width:100%;align-items:stretch;gap:8px;text-align:left;padding:2px 0 16px}
.shop button{touch-action:manipulation;-webkit-touch-callout:none}
.shop .hdr2{padding:0 2px;align-items:flex-end}
.shop .hdr2 h2{font-size:27px;line-height:1}
.shop .hdr2 .st{font-size:19px;line-height:1;padding:0;min-width:0;text-align:right}
.shop .hdr2 .st small{font-size:8px;margin-bottom:3px}

/* faixa de informações da próxima fase */
.shp-info{display:flex;flex-direction:column;gap:6px;padding:9px 11px;border:1px solid var(--edge);border-radius:9px;background:var(--pn)}
.shp-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.shp-next,.shp-meta{font:600 9px 'Chivo Mono',ui-monospace,monospace;letter-spacing:.14em;color:var(--mu)}
.shp-next b{font-size:15px;color:var(--tx);letter-spacing:0;margin-left:3px}
.shp-meta b{font-size:13px;color:var(--tx);letter-spacing:0;margin-left:3px}
.shp-pay{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px;font-size:10px;line-height:1.4;color:var(--mu)}
.shp-pay i{font:600 8px 'Chivo Mono',ui-monospace,monospace;letter-spacing:.18em;font-style:normal}
.shp-pay b{font-weight:700;color:var(--mo);margin-left:2px}
.shp-boss{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 7px;padding-top:6px;border-top:1px solid var(--edge);font-size:10px;line-height:1.35;color:var(--mu)}
.shp-boss i{font:700 8px 'Chivo Mono',ui-monospace,monospace;letter-spacing:.16em;font-style:normal;color:var(--ca)}
.shp-boss b{font-size:11px;color:var(--tx)}
.shp-msg{min-height:15px;margin:-2px 0;text-align:center;font-size:10.5px;line-height:1.4;color:var(--mx)}
.shp-msg.bad{color:var(--ca)}

/* painéis */
.shp-panel{padding:8px;border:1px solid var(--edge);border-radius:11px;background:var(--pn)}
.shp-head{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:26px;padding:0 3px 6px}
.shp-t{display:flex;align-items:baseline;gap:7px}
.shp-t b{font:700 9px 'Chivo Mono',ui-monospace,monospace;letter-spacing:.18em;color:var(--tx)}
.shp-t em{font:600 10px 'Chivo Mono',ui-monospace,monospace;font-style:normal;color:var(--mu)}
.shp-head small{font-size:8.5px;letter-spacing:.03em;line-height:1.3;color:var(--mu);text-align:right}
.h-mouse{display:none}
@media(hover:hover) and (pointer:fine){.h-touch{display:none}.h-mouse{display:inline}}
.shp-sell{display:flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--ca);border-radius:6px;background:none;color:var(--ca);font:700 9.5px 'Chivo Mono',ui-monospace,monospace;letter-spacing:.1em;cursor:pointer}
.shp-sell b{font-size:11px;color:var(--mo);letter-spacing:0}
.shp-sell:active{transform:translateY(1px)}

/* poderes comprados */
.shp-owned .rel{padding:9px 6px;border-radius:8px;background:var(--well)}
.shp-owned .rs{--rh:76px}
.rs.buy{animation:buy .55s cubic-bezier(.2,.9,.3,1.3)}
@keyframes buy{0%{scale:.3;rotate:-14deg;opacity:0}60%{scale:1.18;rotate:3deg;opacity:1}100%{scale:1;rotate:0}}

/* vitrine: botões à esquerda, cartas à direita */
.shp-market{display:flex;flex-direction:column;gap:8px;border-color:color-mix(in srgb,var(--ca) 42%,var(--edge))}
.shp-grid{display:grid;grid-template-columns:clamp(70px,21%,96px) minmax(0,1fr);gap:8px}
.shp-actions{display:flex;flex-direction:column;gap:8px}
.shp-go,.shp-roll{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:54px;padding:6px 4px;border-radius:9px;font:700 10px/1.15 'Chivo Mono',ui-monospace,monospace;letter-spacing:.12em;text-align:center;cursor:pointer}
.shp-go{flex:1;border:0;background:var(--mx);color:#16140f;box-shadow:0 3px 0 color-mix(in srgb,var(--mx) 62%,#000);transition:transform .1s,box-shadow .1s}
.shp-go b{font:700 15px/1 'Chivo Mono',ui-monospace,monospace;letter-spacing:.04em}
.shp-go:active{transform:translateY(3px);box-shadow:0 0 0 color-mix(in srgb,var(--mx) 62%,#000)}
.shp-roll{border:0;background:var(--ex);color:#16140f;box-shadow:0 3px 0 color-mix(in srgb,var(--ex) 62%,#000);transition:transform .1s,box-shadow .1s,opacity .2s}
.shp-roll svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.shp-roll .rc{font:700 15px/1 'Chivo Mono',ui-monospace,monospace;color:inherit;letter-spacing:.04em}
.shp-roll:active{transform:translateY(3px);box-shadow:0 0 0 color-mix(in srgb,var(--ex) 62%,#000)}
.shp-roll.off{opacity:.45}
.shp-offers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:8px 6px 9px;border-radius:9px;background:var(--well)}
.shp-slot{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.shp-slot.deal{animation:sdeal .5s cubic-bezier(.2,.9,.3,1.15) backwards;animation-delay:calc(var(--i)*70ms)}
@keyframes sdeal{from{opacity:0;translate:0 16px;scale:.86;rotate:-4deg}}
.ptag{font:700 12px/1 'Chivo Mono',ui-monospace,monospace;color:var(--mo);padding:4px 10px;border-radius:99px;border:1px solid color-mix(in srgb,var(--mo) 45%,transparent);background:color-mix(in srgb,var(--mo) 10%,var(--well));letter-spacing:0}
.ptag.low{opacity:.5}
.ptag.gh{visibility:hidden}

/* carta da loja: só letra e nome (detalhes aparecem no balão ao segurar) */
.shop .cd{position:relative;display:flex;flex-direction:column;align-items:center;width:100%;aspect-ratio:3/4;min-height:0;padding:6px 4px;text-align:center;cursor:pointer;font:inherit;transition:transform .15s,opacity .2s,filter .2s}
.shop .cd.empty{background:none!important;border:1px dashed var(--edge);box-shadow:none;cursor:default}
.shop .cd.empty::before{display:none}
.shop .cd .tp{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;width:100%;height:12px;padding:0 3px}
.shop .cd .art{flex:1;min-height:0;width:100%;--af:clamp(30px,9.5vw,44px);margin:3px 0;border-radius:5px;background:linear-gradient(180deg,#fff,#f8f8f5);border:1px solid #efefeb;overflow:hidden}
.shop .cd .nm{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;min-height:2.35em;font:400 clamp(8px,2.3vw,9.5px)/1.15 'Alfa Slab One',Georgia,serif;letter-spacing:.03em;text-transform:uppercase;color:#202326;overflow-wrap:anywhere}
.shop .cd.off{opacity:.5;filter:saturate(.7)}
.shop .cd:not(.off):active{transform:translateY(1px) scale(.97)}
@media(hover:hover){.shop .cd:not(.off):hover{transform:translateY(-4px) rotate(-1.2deg)}}
.nope{animation:nope .38s}
@keyframes nope{20%,60%{translate:-4px 0}40%,80%{translate:4px 0}}

/* melhorias de letras: mini-peças iguais às do jogo */
.shp-letters{padding:6px 8px 9px;border-radius:9px;background:var(--well)}
.shp-letters .shp-head{min-height:22px;padding:0 1px 4px}
.shp-ups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.shp-up{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:3px 0 5px;border:0;background:none;color:var(--tx);text-align:left;cursor:pointer;font:inherit}
.shp-up .tl{--tw:32px;--th:42px;flex:none;cursor:inherit;transition:transform .15s}
.shp-up .tx{display:flex;flex-direction:column;gap:3px;min-width:0}
.shp-up .tx b{font:700 10px/1.1 'Chivo Mono',ui-monospace,monospace;letter-spacing:.02em}
.shp-up .tx small{font:500 8.5px/1.15 'Chivo Mono',ui-monospace,monospace;color:var(--mu)}
.shp-up.off{opacity:.5}
.shp-up:not(.off):active .tl{transform:translateY(2px)}
@media(hover:hover){.shp-up:not(.off):hover .tl{transform:translateY(-3px) rotate(-4deg)}}
@media(max-width:380px){.shp-up{gap:5px}.shp-up .tx small{font-size:8px}}
@media(max-width:340px){
  .shp-grid{grid-template-columns:1fr}
  .shp-actions{flex-direction:row}
  .shp-go,.shp-roll{flex-direction:row;gap:7px;min-height:44px}
  .shp-up .tl{--tw:28px;--th:38px}
}

/* balão de detalhes (fundo branco): aparece ao segurar a carta ou passar o mouse */
#tip{position:fixed;z-index:90;left:0;top:0;width:min(252px,calc(100vw - 16px));padding:11px 12px;border-radius:11px;background:#fff;color:#1d1f22;font:12px/1.4 'Chivo Mono',ui-monospace,monospace;text-align:left;box-shadow:0 10px 30px #000b,0 0 0 1px #0000001f;pointer-events:none;opacity:0;visibility:hidden;transform:translateY(5px) scale(.95);transform-origin:var(--ax,50%) 100%;transition:opacity .14s,transform .17s cubic-bezier(.2,.9,.3,1.2),visibility 0s linear .17s}
#tip[data-pos=bottom]{transform-origin:var(--ax,50%) 0}
#tip.on{opacity:1;visibility:visible;transform:none;transition-delay:0s}
#tip::after{content:"";position:absolute;left:var(--ax,50%);width:12px;height:12px;background:#fff;rotate:45deg;translate:-50% 0}
#tip[data-pos=top]::after{bottom:-6px;box-shadow:2px 2px 2px #0000001a}
#tip[data-pos=bottom]::after{top:-6px;box-shadow:-2px -2px 2px #0000001a}
#tip .th{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-bottom:8px;border-bottom:1px solid #ecece8}
#tip .tn{font:400 13px/1.15 'Alfa Slab One',Georgia,serif;letter-spacing:.03em;text-transform:uppercase}
#tip .tr{flex:none;padding:3px 6px;border:1px solid;border-radius:4px;font:700 8px/1 'Chivo Mono',ui-monospace,monospace;letter-spacing:.1em}
#tip .tr.q0{color:#656761;background:#f4f4f1;border-color:#deded9}
#tip .tr.q1{color:#3978ac;background:#f0f7fc;border-color:#c5dced}
#tip .tr.q2{color:#7855b1;background:#f6f0ff;border-color:#ded0f1}
#tip .ts{padding-top:9px}
#tip .ts small{display:block;margin-bottom:5px;font:700 7.5px 'Chivo Mono',ui-monospace,monospace;letter-spacing:.2em;color:#8a8d90}
#tip .tb{display:flex;align-items:flex-start;gap:8px;font-size:11px;line-height:1.4;color:#34373a}
#tip .tk{flex:none;display:inline-flex;align-items:center;gap:4px;padding:3px 7px 3px 5px;border-radius:4px;background:color-mix(in srgb,var(--c) 13%,#fff);color:var(--c);font:700 9px/1.2 'Chivo Mono',ui-monospace,monospace;letter-spacing:.05em;white-space:nowrap}
#tip .tk .kg{width:11px;height:11px;stroke:currentColor}
#tip p{margin:0;font-size:11.5px;line-height:1.45;color:#34373a}
#tip .tw{margin-top:10px;padding:6px 8px;border-radius:5px;background:#fff1ec;color:#b3361b;font-size:10px;font-weight:600;line-height:1.35}

/* acessibilidade: foco visível no teclado e respeito a "reduzir movimento" */
.shop button:focus-visible{outline:2px solid var(--mx);outline-offset:2px}

/* animação ao comprar melhoria de letra */

const DIC_ONLINE_CACHE=new Map();
const DIC_ONLINE_SILENT_FAILED=new Set();
const DicionarioOnline=Object.freeze({
  estado(palavra){
    const chave=normalizarPalavra(palavra);
    if(DIC.has(chave))return true;
    return DIC_ONLINE_CACHE.has(chave)?DIC_ONLINE_CACHE.get(chave):null;
  },
  async consultar(palavra){
    const chave=normalizarPalavra(palavra);
    if(DIC.has(chave))return true;
    if(DIC_ONLINE_CACHE.has(chave))return DIC_ONLINE_CACHE.get(chave);
    if(!/^[a-z]{3,8}$/.test(chave))return false;
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),7000);
    const base="https://pt.wiktionary.org/w/api.php";
    const requisitar=async params=>{
      const url=base+"?"+params.toString();
      const res=await fetch(url,{method:"GET",mode:"cors",cache:"no-store",signal:controller.signal});
      if(!res.ok)throw new Error("Falha ao consultar o dicionário");
      return res.json();
    };
    const temSecaoPortuguesa=async titulo=>{
      const params=new URLSearchParams({action:"parse",format:"json",formatversion:"2",origin:"*",redirects:"1",page:titulo,prop:"wikitext"});
      const dados=await requisitar(params);
      const bruto=dados?.parse?.wikitext;
      const texto=typeof bruto==="string"?bruto:(bruto?.["*"]||"");
      // O Wikcionário reúne idiomas diferentes na mesma página. Só vale uma entrada
      // que tenha seção própria de Português; encontrar apenas o título não basta.
      return /^(={1,2})\s*(?:\{\{\s*-?pt-?\s*\}\}|Portugu[eê]s)\s*\1\s*$/im.test(texto);
    };
    try{
      const busca=new URLSearchParams({action:"query",format:"json",formatversion:"2",origin:"*",list:"search",srsearch:chave,srnamespace:"0",srlimit:"20"});
      const dados=await requisitar(busca);
      const titulos=(dados?.query?.search||[])
        .filter(item=>normalizarPalavra(item.title)===chave)
        .map(item=>item.title);
      // Se a busca não entregar o título, tenta a grafia sem acento diretamente.
      if(!titulos.length)titulos.push(chave);
      let encontrada=false;
      for(const titulo of [...new Set(titulos)]){
        if(await temSecaoPortuguesa(titulo)){encontrada=true;break;}
      }
      DIC_ONLINE_CACHE.set(chave,encontrada);
      if(encontrada){
        DIC.add(chave);
        if(typeof DICARR!=="undefined"&&!DICARR.includes(chave))DICARR.push(chave);
      }
      return encontrada;
    }catch(e){
      // Falha de rede não é prova de que a palavra não existe.
      return null;
    }finally{clearTimeout(timer)}
  }
});

let handDrag=null,suppressHandClick=false,suppressHandClickTimer=null;
function handDropTarget(d,x,y){
  const els=[...d.hand.querySelectorAll(':scope > [data-h]')].filter(el=>el!==d.el);
  if(!els.length){d.hand.appendChild(d.placeholder);return}
  const rows=[];
  for(const el of els){
    const r=el.getBoundingClientRect();
    let row=rows.find(q=>Math.abs(q.top-r.top)<Math.max(8,r.height*.35));
    if(!row){row={top:r.top,bottom:r.bottom,els:[]};rows.push(row)}
    row.top=Math.min(row.top,r.top);row.bottom=Math.max(row.bottom,r.bottom);row.els.push({el,r});
  }
  rows.sort((a,b)=>a.top-b.top);
  let row=rows[0],dist=Infinity;
  for(const q of rows){const dd=y<q.top?q.top-y:y>q.bottom?y-q.bottom:0;if(dd<dist){dist=dd;row=q}}
  row.els.sort((a,b)=>a.r.left-b.r.left);
  const first=row.els[0],last=row.els[row.els.length-1];
  if(x<first.r.left+first.r.width/2)d.hand.insertBefore(d.placeholder,first.el);
  else{
    const next=row.els.find(q=>x<q.r.left+q.r.width/2);
    if(next)d.hand.insertBefore(d.placeholder,next.el);
    else last.el.after(d.placeholder);
  }
}
function traySlotAt(x,y){
  const tray=document.querySelector('.tray');if(!tray)return null;
  const tr=tray.getBoundingClientRect();if(x<tr.left||x>tr.right||y<tr.top||y>tr.bottom)return null;
  const slots=[...tray.querySelectorAll(':scope > .slot')];if(!slots.length)return null;
  const inside=slots.find(el=>{const r=el.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom});
  if(inside)return inside;
  let best=null,dist=Infinity;
  for(const el of slots){const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,d=Math.hypot(x-cx,y-cy);if(d<dist){dist=d;best=el}}
  return best;
}
function setTrayHover(d,target){

  d.trayTarget=target?Number(target.dataset.slot):null;
}
function clearDragMarks(){document.querySelectorAll('.tray .slot.drop-target,.tray .slot.drag-source,.hand.coop-drop-target').forEach(el=>el.classList.remove('drop-target','drag-source','coop-drop-target'))}
function beginHandDrag(d,e){
  const r=d.el.getBoundingClientRect();d.moved=true;
  d.placeholder=document.createElement('div');d.placeholder.className='hand-placeholder';d.placeholder.dataset.dragPlaceholder='';
  d.placeholder.style.width=r.width+'px';d.placeholder.style.height=r.height+'px';d.el.before(d.placeholder);
  d.el.classList.add('dragging-hand-tile');
  Object.assign(d.el.style,{left:(e.clientX-d.offsetX)+'px',top:(e.clientY-d.offsetY)+'px',width:r.width+'px',height:r.height+'px',margin:'0'});
  try{d.el.setPointerCapture(e.pointerId)}catch(_){ }
}
function beginTrayDrag(d,e){
  const r=d.el.getBoundingClientRect();d.moved=true;d.sourceSlot=d.el.closest('.slot');
  if(d.sourceSlot)d.sourceSlot.classList.add('drag-source');
  d.el.classList.add('dragging-tray-tile');
  Object.assign(d.el.style,{left:(e.clientX-d.offsetX)+'px',top:(e.clientY-d.offsetY)+'px',width:r.width+'px',height:r.height+'px',margin:'0'});
  try{d.el.setPointerCapture(e.pointerId)}catch(_){ }
}
function moveHandDrag(e){
  const d=handDrag;if(!d||e.pointerId!==d.pointerId)return;
  const dx=e.clientX-d.startX,dy=e.clientY-d.startY;
  if(!d.moved){if(Math.hypot(dx,dy)<7)return;if(!coopBeginLocalDrag(d)){e.preventDefault();d.remoteRejected=true;finishHandDrag(e,true);return}if(d.mode==='tray')beginTrayDrag(d,e);else beginHandDrag(d,e)}
  e.preventDefault();
  d.el.style.left=(e.clientX-d.offsetX)+'px';d.el.style.top=(e.clientY-d.offsetY)+'px';
  const target=traySlotAt(e.clientX,e.clientY);setTrayHover(d,target);
  if(d.mode==='hand'&&!target)handDropTarget(d,e.clientX,e.clientY);
  coopSendDragPreview(d,e,target);
}
function sortHand(){R.hand.sort((a,b)=>a.o-b.o)}
function nearestFreeTraySlot(excludeSet,near){
  let best=-1,dist=Infinity;
  for(let i=0;i<8;i++)if(!excludeSet.has(i)){const d=Math.abs(i-near);if(d<dist){dist=d;best=i}}
  return best;
}
function placeHandTileInTray(id,slot){
  const hi=R.hand.findIndex(t=>String(t.id)===String(id));if(hi<0||R.st.length>=8)return false;
  const tile=R.hand.splice(hi,1)[0];
  const occupied=R.stPos.indexOf(slot);
  if(occupied>=0){
    const used=new Set(R.stPos),free=nearestFreeTraySlot(used,slot);
    if(free<0){R.hand.push(tile);sortHand();return false}
    R.stPos[occupied]=free;
  }
  R.st.push(tile);R.stPos.push(slot);sortStByPos();R.msg="";sortHand();sTile(R.st.length-1);vb(6);return true;
}
function moveTrayTileToSlot(index,slot){
  if(!R.st[index]||!Number.isInteger(slot)||slot<0||slot>7)return false;
  const from=R.stPos[index];if(from===slot)return false;
  const other=R.stPos.indexOf(slot);
  if(other>=0)R.stPos[other]=from;
  R.stPos[index]=slot;sortStByPos();R.msg="";sTile(slot);vb(6);return true;
}
function finishHandDrag(e,cancelled=false){
  const d=handDrag;if(!d||(e&&e.pointerId!==d.pointerId))return;
  const target=!cancelled&&e?traySlotAt(e.clientX,e.clientY):null;
  const targetSlot=target?Number(target.dataset.slot):null;
  if(d.moved&&e&&COOP.connected&&!cancelled)coopSendDragPreview(d,e,target);
  if(d.moved&&COOP.connected)coopFlushDragPreview();
  handDrag=null;clearDragMarks();
  if(COOP.connected&&COOP.role==="guest"&&d.moved){
    if(!d.remoteRejected&&!cancelled){
      if(d.mode==="tray"){
        const handRect=document.querySelector(".hand")?.getBoundingClientRect();
        const overHand=!!(e&&handRect&&e.clientX>=handRect.left&&e.clientX<=handRect.right&&e.clientY>=handRect.top&&e.clientY<=handRect.bottom);
        if(targetSlot!==null)coopSend({type:"dragCommit",kind:"tray-to-slot",id:String(d.id),slot:targetSlot});
        else if(overHand)coopSend({type:"dragCommit",kind:"tray-to-hand",id:String(d.id)});
        else if(!cancelled)coopSend({type:"dragCancel",id:String(d.id)});
      }else if(targetSlot!==null){coopSend({type:"dragCommit",kind:"hand-to-tray",id:String(d.id),slot:targetSlot})}
      else{
        const ids=[...d.hand.children].filter(el=>el===d.placeholder||(el.matches('[data-h]')&&el!==d.el)).map(el=>el===d.placeholder?String(d.id):String(el.dataset.id));
        coopSend({type:"dragCommit",kind:"hand-reorder",id:String(d.id),order:ids});
      }
    }else if(!d.remoteRejected)coopSend({type:"dragCancel",id:String(d.id)});
    suppressHandClick=true;clearTimeout(suppressHandClickTimer);suppressHandClickTimer=setTimeout(()=>{suppressHandClick=false},180);
    if(COOP.dragLock&&COOP.dragLock.owner==="guest"&&String(COOP.dragLock.id)===String(d.id))COOP.dragLock=null;
    coopClearRemoteDrag(false);
    if(d.el&&d.el.isConnected){d.el.classList.remove('dragging-hand-tile','dragging-tray-tile');d.el.style.position='';d.el.style.left='';d.el.style.top='';d.el.style.width='';d.el.style.height='';d.el.style.margin='';d.el.style.zIndex='';d.el.style.pointerEvents='';d.el.style.display=''}
    ren();coopQueuePendingSnapshot();
    return;
  }
  if(d.mode==='tray'){
    if(d.moved){
      let validDrop=false;
      if(!cancelled){
        if(targetSlot!==null)validDrop=moveTrayTileToSlot(d.index,targetSlot);
        else if(e){const hr=document.querySelector(".hand")?.getBoundingClientRect();if(hr&&e.clientX>=hr.left&&e.clientX<=hr.right&&e.clientY>=hr.top&&e.clientY<=hr.bottom){const i=R.st.findIndex(t=>String(t.id)===String(d.id));if(i>=0){unstage(i);validDrop=true}}}
        suppressHandClick=true;clearTimeout(suppressHandClickTimer);suppressHandClickTimer=setTimeout(()=>{suppressHandClick=false},180)
      }
      ren();coopFinishLocalDrag(d,cancelled||!validDrop);
    }
    return;
  }
  if(d.moved&&!cancelled&&targetSlot!==null){
    placeHandTileInTray(d.id,targetSlot);
    suppressHandClick=true;clearTimeout(suppressHandClickTimer);suppressHandClickTimer=setTimeout(()=>{suppressHandClick=false},180);
    ren();coopFinishLocalDrag(d,false);
  }else if(d.moved&&!cancelled){
    const byId=new Map(R.hand.map(t=>[String(t.id),t]));
    const ids=[...d.hand.children].filter(el=>el===d.placeholder||(el.matches('[data-h]')&&el!==d.el)).map(el=>el===d.placeholder?String(d.id):String(el.dataset.id));
    const reordered=ids.map(id=>byId.get(id)).filter(Boolean);
    if(reordered.length===R.hand.length){R.hand=reordered;R.hand.forEach((t,i)=>t.o=i)}
    suppressHandClick=true;clearTimeout(suppressHandClickTimer);suppressHandClickTimer=setTimeout(()=>{suppressHandClick=false},180);
    ren();coopFinishLocalDrag(d,false);
  }else if(d.moved){ren();coopFinishLocalDrag(d,true)}
  else if(d.el.isConnected){d.el.classList.remove('dragging-hand-tile');d.el.style.position='';d.el.style.left='';d.el.style.top='';d.el.style.width='';d.el.style.height='';d.el.style.margin='';d.el.style.zIndex='';d.el.style.pointerEvents='';if(COOP.role==="guest")coopQueuePendingSnapshot()}
}
document.addEventListener('pointerdown',e=>{
  if(!e.isPrimary||(e.button!==undefined&&e.button!==0)||G.mode!=='play'||!R||R.lock||R.dv)return;
  if(COOP.connected&&COOP.dragLock&&COOP.dragLock.owner!==COOP.role){e.preventDefault();return}
  const handEl=e.target.closest('.hand [data-h]');
  const trayEl=e.target.closest('.tray [data-s]');
  const el=handEl||trayEl;if(!el)return;
  const hand=handEl?el.closest('.hand'):null,r=el.getBoundingClientRect();
  handDrag={mode:handEl?'hand':'tray',el,hand,id:el.dataset.id,index:trayEl?Number(el.dataset.s):-1,pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,offsetX:e.clientX-r.left,offsetY:e.clientY-r.top,moved:false,placeholder:null,trayTarget:null};
},true);
document.addEventListener('pointermove',moveHandDrag,{passive:false});
document.addEventListener('pointerup',e=>finishHandDrag(e,false),true);
document.addEventListener('pointercancel',e=>finishHandDrag(e,true),true);

/* ---------- balão de detalhes da loja: segurar (celular) ou passar o mouse (computador) ---------- */
const tipEl=document.createElement("div");tipEl.id="tip";tipEl.setAttribute("role","tooltip");document.body.appendChild(tipEl);
let tipFor=null,tipTimer=0,pressTimer=0,tipHeld=false,tipBlock=0,pressX=0,pressY=0;
function hideTip(){clearTimeout(tipTimer);tipEl.classList.remove("on");tipFor=null}
function tipHtml(el){
  const D=el.dataset;let n,k,rar=-1,ben,d,warn="";
  if(D.o!==undefined||D.r!==undefined){
    const buy=D.o!==undefined,r=buy?G.off[+D.o]:G.rel[+D.r];if(!r)return"";
    n=r.n;k=r.k;rar=r.r;ben=TIPK[r.k];d=r.d;
    if(buy)warn=G.rel.length>=RMAX?"Você já tem "+RMAX+" poderes. Venda um para comprar.":G.$<r.c?"Moedas insuficientes.":"";
  }else if(UPS[D.a]){
    const u=UPS[D.a];n=u.n;k=u.k;ben=u.b;d=u.d;if(G.$<u.c)warn="Moedas insuficientes.";
  }else return"";
  return `<div class="th"><b class="tn">${n}</b>${rar>=0?`<span class="tr q${rar}">${RAR[rar]}</span>`:""}</div>
  <div class="ts"><small>BENEFÍCIO</small><div class="tb"><span class="tk" style="--c:${KCOL[k]}">${kg(k)}${KL[k]}</span><span>${ben}</span></div></div>
  <div class="ts"><small>DESCRIÇÃO</small><p>${d}</p></div>${warn?`<div class="tw">${warn}</div>`:""}`;
}
function showTip(el){
  if(G.mode!=="shop"||!el||!el.isConnected)return;
  const h=tipHtml(el);if(!h){hideTip();return}
  tipEl.innerHTML=h;tipFor=el;
  const r=el.getBoundingClientRect(),vw=document.documentElement.clientWidth,vh=window.innerHeight,w=tipEl.offsetWidth,th=tipEl.offsetHeight,m=8,gap=10;
  const x=Math.max(m,Math.min(r.left+r.width/2-w/2,vw-w-m)),up=r.top-th-gap>=m;
  const y=up?r.top-th-gap:Math.min(r.bottom+gap,Math.max(m,vh-th-m));
  tipEl.style.left=x+"px";tipEl.style.top=y+"px";
  tipEl.style.setProperty("--ax",Math.max(16,Math.min(w-16,r.left+r.width/2-x))+"px");
  tipEl.dataset.pos=up?"top":"bottom";
  tipEl.classList.add("on");
}
/* mouse: passar por cima mostra, sair esconde */
document.addEventListener("pointerover",e=>{
  if(e.pointerType!=="mouse"||G.mode!=="shop")return;
  const el=e.target.closest("[data-tip]");if(!el||el===tipFor)return;
  clearTimeout(tipTimer);tipTimer=setTimeout(()=>showTip(el),80);
});
document.addEventListener("pointerout",e=>{
  if(e.pointerType!=="mouse")return;
  const el=e.target.closest("[data-tip]");if(el&&!el.contains(e.relatedTarget))hideTip();
});
/* toque: segurar ~0,4 s mostra o balão enquanto o dedo estiver na carta; soltar esconde e não compra */
document.addEventListener("pointerdown",e=>{
  if(G.mode!=="shop"||e.pointerType==="mouse")return;
  const el=e.target.closest("[data-tip]");if(!el)return;
  pressX=e.clientX;pressY=e.clientY;tipHeld=false;clearTimeout(pressTimer);
  pressTimer=setTimeout(()=>{pressTimer=0;tipHeld=true;showTip(el);vb(8)},380);
},true);
document.addEventListener("pointermove",e=>{
  if(!pressTimer&&!tipHeld)return;
  if(Math.hypot(e.clientX-pressX,e.clientY-pressY)>12){clearTimeout(pressTimer);pressTimer=0;if(tipHeld){tipHeld=false;hideTip()}}
},true);
document.addEventListener("pointerup",()=>{
  clearTimeout(pressTimer);pressTimer=0;
  if(tipHeld){tipHeld=false;tipBlock=performance.now()+600;hideTip()}
},true);
document.addEventListener("pointercancel",()=>{clearTimeout(pressTimer);pressTimer=0;tipHeld=false;hideTip()},true);
/* o clique que vem logo depois de segurar não pode comprar nada */
document.addEventListener("click",e=>{if(tipBlock&&performance.now()<tipBlock){tipBlock=0;e.preventDefault();e.stopImmediatePropagation()}},true);
document.addEventListener("contextmenu",e=>{if(e.target.closest&&e.target.closest("[data-tip]"))e.preventDefault()});
/* teclado: foco mostra o balão */
document.addEventListener("focusin",e=>{const el=e.target.closest&&e.target.closest("[data-tip]");if(el&&G.mode==="shop"&&el.matches(":focus-visible"))showTip(el)});
document.addEventListener("focusout",e=>{if(e.target.closest&&e.target.closest("[data-tip]"))hideTip()});
document.addEventListener("scroll",hideTip,true);

/* ---------- entrada ---------- */
document.addEventListener("click",e=>{
  if(suppressHandClick&&!COOP.remoteDispatch){e.preventDefault();e.stopPropagation();suppressHandClick=false;clearTimeout(suppressHandClickTimer);return}
  const t=e.target.closest("[data-h],[data-s],[data-l],[data-a],[data-dk],[data-o],[data-r]");if(!t)return;au();
  const D=t.dataset;
  if(D.a==="theme"){S.theme=S.theme?0:1;save();applyTheme();sTec();ren();return}
  if(D.a==="mute"){S.mute=S.mute?0:1;save();sTec();ren();return}
  if(COOP.connected&&COOP.role==="guest"&&!COOP.remoteDispatch){e.preventDefault();e.stopPropagation();coopSendActionFromElement(t);return}
  if(COOP.connected&&COOP.dragLock&&COOP.dragLock.owner!==COOP.role){e.preventDefault();e.stopPropagation();COOP.modalNote="Aguarde o fim do arrasto do outro jogador.";coopUpdateStatus();return}
  if(G.mode==="title"){
    if(D.dk!==undefined){G.dk=+D.dk;if(COOP.role==="host"&&!COOP.connected){COOP.deck=G.dk;if(document.querySelector(".coop-modal")&&COOP.modalView==="waiting")coopRenderModal()}sTec();ren()}
    else if(D.a==="start"){if(COOP.role==="host"&&!COOP.connected){COOP.modalNote="A sala ainda está aguardando P2. Cancele a sala para voltar ao modo solo.";coopShowModal("waiting");return}novo()}return;
  }
  if(G.mode==="over"){
    if(D.a==="again")novo();else if(D.a==="title"){G.mode="title";ren()}
    else if(D.a==="endless"){G.endless=true;G.n++;G.nb=bossAt(G.n);G.mode="shop";G.rr=0;G.sel=-1;G.msg="";oferta();sOk();ren()}return;
  }
  if(G.mode==="shop"){
    if(D.o!==undefined)compra(+D.o);
    else if(D.r!==undefined){G.sel=G.sel===+D.r?-1:+D.r;sTec();ren()}
    else if(D.a==="sg")carimbo("g");else if(D.a==="sr")carimbo("r");else if(D.a==="sk")carimbo("k");
    else if(D.a==="rr")reimprimir();else if(D.a==="sell")vender();
    else if(D.a==="next"){G.msg="";sGo();rodada()}return;
  }
  if(R.dv&&D.l!==undefined){dkToggle(D.l);return}
  if(R.lock){R.fast=true;return}
  if(D.h!==undefined)stage(+D.h);else if(D.s!==undefined)unstage(+D.s);
  else if(D.r!==undefined){const r=G.rel[+D.r];if(r){R.msg=r.n+" — "+r.d;sTec();ren()}}
  else if(D.a==="play")jogar();else if(D.a==="disc")descartar();else if(D.a==="deck"){R.dv=1;R.dx={};sDkOpen();ren()}else if(D.a==="dvx"){R.dv=0;sDkClose();ren()}else if(D.a==="clr")limpar();
});
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(COOP.connected&&COOP.role==="guest"){
    if(G.mode==="title"){if(e.key==="Enter")coopSend({type:"action",kind:"a",value:"start"});return}
    if(G.mode==="over"){if(e.key==="Enter")coopSend({type:"action",kind:"a",value:"again"});return}
    if(G.mode!=="play"||!R)return;
    if(R.dv){if(e.key==="Escape"||e.key==="Enter")coopSend({type:"action",kind:"a",value:"dvx"});return}
    if(R.lock)return;
    if(/^[a-zA-Z]$/.test(e.key)){const tile=R.hand.find(t=>t.l===e.key.toUpperCase());if(tile)coopSend({type:"action",kind:"hand",id:String(tile.id)});else sErr()}
    else if(e.key==="Enter"){e.preventDefault();coopSend({type:"action",kind:"a",value:"play"})}
    else if(e.key==="Backspace"){e.preventDefault();if(R.st.length)coopSend({type:"action",kind:"tray",id:String(R.st[R.st.length-1].id)})}
    return;
  }
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(G.mode==="title"){if(e.key==="Enter")novo();return}
  if(G.mode==="over"){if(e.key==="Enter")novo();return}
  if(G.mode!=="play"||!R)return;
  if(R.dv){if(e.key==="Escape"||e.key==="Enter"){R.dv=0;sDkClose();ren()}return}
  if(R.lock){R.fast=true;return}
  const k=e.key;
  if(/^[a-zA-Z]$/.test(k)){const i=R.hand.findIndex(t=>t.l===k.toUpperCase());if(i>=0)stage(i);else sErr()}
  else if(k==="Enter"){e.preventDefault();jogar()}
  else if(k==="Backspace"){e.preventDefault();if(R.st.length)unstage(R.st.length-1)}
});
applyTheme();ren();
</script>
