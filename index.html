<!doctype html>
<html lang="pt-BR">
<head>

<title>Caixa Alta</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Chivo+Mono:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{--bg:#111113;--tx:#e8e3d6;--mu:#7b766b;--ln:#2a2a2e;--pp:#ece6d8;--pk:#16140f;--ps:#a39b88;--gs:#8d8d8d;--gg:#ffffff88;--fc:#ff5a3d;--ti:#ffffff;--ca:#ff5a3d;--mx:#ffb21f;--mo:#62c98a;--ex:#b794f6;--ink:var(--ti);--caos:var(--ca);--gold:var(--mx);--mint:var(--mo);--paper:var(--tx);
--tw:calc((min(100vw,480px) - 60px)/8);--th:calc(var(--tw)*1.3);color-scheme:dark;font-synthesis:none}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--tx);font:13px/1.4 'Chivo Mono','Chivo Mono',ui-monospace,monospace;-webkit-user-select:none;user-select:none;overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
body.boss{background:#170d0c}
#bg,#fx{display:block;position:fixed;inset:0;width:100%;height:100%;pointer-events:none}#bg{z-index:0}#fx{z-index:40}
#fl{position:fixed;inset:0;z-index:45;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 40%,transparent 35%,var(--fc) 140%)}
#fl.on{animation:flash .4s ease-out}@keyframes flash{0%{opacity:.55}100%{opacity:0}}
#app{position:relative;z-index:5;width:min(480px,100%);height:100%;min-height:0;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
@supports(height:100dvh){#app{height:100dvh}}
#app.sk{animation:sk .38s}
@keyframes sk{0%,100%{translate:0 0}20%{translate:calc(var(--sh)*-1) calc(var(--sh)*.5)}40%{translate:var(--sh) calc(var(--sh)*-.6)}60%{translate:calc(var(--sh)*-.6) 0}80%{translate:calc(var(--sh)*.4) calc(var(--sh)*.3)}}
.kc{--k:var(--ti)}.km{--k:var(--ca)}.kx{--k:var(--mx)}.ko{--k:var(--mo)}.ku{--k:var(--ex)}
.hdr{display:flex;align-items:flex-end;gap:14px}
.ed{flex:none;font:700 34px/1 'Alfa Slab One',Georgia,serif}
.ed small{display:block;font:500 8px/1 'Chivo Mono',ui-monospace,monospace;letter-spacing:.24em;color:var(--mu);margin-bottom:5px}
.ed i{font-style:normal;font-size:13px;color:var(--mu)}
.goal{flex:1;min-width:0}
.gt{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.2em;color:var(--mu);margin-bottom:6px}
.gt b{color:var(--tx);font-weight:600;letter-spacing:.02em}
.bar{height:3px;background:var(--ln)}.bar i{display:block;height:100%;background:var(--ti);transition:width .6s cubic-bezier(.2,.8,.2,1)}.bar.bs i{background:var(--bc,var(--ca))}
.mute{flex:none;border:1px solid var(--ln);background:none;color:var(--mu);font:500 9px 'Chivo Mono',ui-monospace,monospace;letter-spacing:.14em;padding:7px 9px;border-radius:3px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-block:1px solid var(--ln)}
.st{padding:7px 4px;text-align:center;font:600 16px/1.1 'Chivo Mono',ui-monospace,monospace}
.st+.st{border-left:1px solid var(--ln)}
.st small{display:block;font:500 8px 'Chivo Mono',ui-monospace,monospace;letter-spacing:.2em;color:var(--mu);margin-bottom:3px}
.st.g{color:var(--mo)}
.key{padding:2px 0 5px;text-align:center;border-bottom:1px solid var(--ln)}
.key small{display:block;font:500 8px 'Chivo Mono',ui-monospace,monospace;letter-spacing:.34em;color:var(--mu)}
.key small.key-prize{margin:0 auto 3px;max-width:94%;font:600 12px/1.35 'Chivo Mono',ui-monospace,monospace;letter-spacing:.01em;color:color-mix(in srgb,var(--tx) 78%,var(--mu));opacity:1;white-space:normal;text-wrap:balance}
.key small.key-prize::before{content:'◆ ';color:var(--mx);font-size:10px;vertical-align:1px}
.key small.key-prize .kp-label{color:var(--mx);font-weight:700}
.key b{display:block;margin:0 0 5px;font:700 28px/1.15 'Alfa Slab One',Georgia,serif;letter-spacing:0;color:var(--mx);text-indent:0}
.key-word{position:relative;display:inline-flex;gap:.24em;line-height:1.15;white-space:nowrap}
.key-word>span{display:block;letter-spacing:0}
.key.hit .key-word::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:3px;background:var(--mx)}
/* Selo de prêmio Caixa Alta: tipográfico, discreto e sem ícone. */
.key em{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;max-width:min(100%,360px);margin:0;padding:4px 10px;border:1px solid color-mix(in srgb,var(--mx) 32%,var(--ln));border-left:2px solid var(--mx);border-radius:3px;background:linear-gradient(105deg,color-mix(in srgb,var(--mx) 10%,transparent),color-mix(in srgb,var(--mx) 2%,transparent));font:600 9px/1.25 'Chivo Mono',ui-monospace,monospace;letter-spacing:.035em;color:var(--tx);text-align:center;white-space:normal;overflow-wrap:anywhere;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--mx) 3%,transparent)}
.key em .prize-label{color:var(--mx);font-weight:700}
/* Aviso de chefe compacto: mantém o vermelho e mostra apenas selo, nome, regra e frase. */
/* Aviso de chefe mais estreito, sem a faixa decorativa superior e centralizado. */
.bossb{position:relative;flex:none;display:flex;align-items:center;gap:7px;width:min(100%,286px);max-width:100%;align-self:center;padding:6px 8px 6px 7px;text-align:left;border:1px solid var(--bc,var(--ca));border-left-width:3px;border-radius:3px;overflow:hidden;background:linear-gradient(100deg,color-mix(in srgb,var(--bc,var(--ca)) 16%,transparent),color-mix(in srgb,var(--bc,var(--ca)) 3%,transparent) 72%)}
.bb-g{position:relative;flex:none;display:grid;place-items:center;width:36px;height:36px;border:1px solid var(--bc,var(--ca));border-radius:3px;font:700 17px/1 'Alfa Slab One',Georgia,serif;letter-spacing:-.02em;color:var(--bc,var(--ca));background:color-mix(in srgb,var(--bc,var(--ca)) 12%,var(--bg));animation:bbPulse 2.6s ease-in-out infinite}
.bossb[data-b=ce] .bb-g::after,.bossb[data-b=in] .bb-g::after{content:"";position:absolute;left:-3px;right:-3px;top:50%;height:3px;margin-top:-1.5px;background:var(--bc,var(--ca));rotate:-38deg;box-shadow:0 0 0 1px var(--bg)}
.bb-body{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center}
.bb-top{display:flex;align-items:baseline;justify-content:center;gap:6px;min-width:0;width:100%;text-align:center}
.bb-top b{font:400 14px/1.1 'Alfa Slab One',Georgia,serif;color:var(--tx);text-align:center}
.bb-rule{font:700 10px/1.25 'Chivo Mono',ui-monospace,monospace;color:var(--bc);text-align:center;overflow-wrap:anywhere}
.bb-q{margin:0;font-size:9px;line-height:1.25;font-style:italic;color:var(--mu)}
@keyframes bbPulse{50%{box-shadow:0 0 10px color-mix(in srgb,var(--bc) 40%,transparent)}}
@media(prefers-reduced-motion:reduce){.bb-g{animation:none}}
@media(max-height:700px) and (max-width:600px){.bb-g{width:32px;height:32px;font-size:15px}.bossb{gap:7px;padding-block:5px}.bb-top b{font-size:13px}.bb-rule{font-size:9.5px}.bb-q{font-size:8.5px}}
.rel{display:grid;grid-template-columns:repeat(var(--rc,5),1fr);gap:6px}
@keyframes rpop{40%{transform:scale(1.18)}}
.board{padding:4px 0;display:flex;flex-direction:column;gap:7px;align-items:center}
.pill{font-size:11px;letter-spacing:.06em;color:var(--mu);min-height:16px;text-align:center}
.pill.ok{color:var(--mo)}.pill.er{color:var(--ca)}.pill.nv{color:var(--ca)}
/* Classificações: assinatura tipográfica do Caixa Alta — brilho metálico, filetes laterais e entrada curta. Tudo ocupa a mesma linha de 16px do aviso anterior. */
.pill.word-tier{
  position:relative;display:flex;align-items:center;justify-content:center;gap:8px;
  width:max-content;max-width:100%;min-height:16px;height:16px;margin:0 auto;padding:0 2px;
  box-sizing:border-box;overflow:visible;white-space:nowrap;line-height:16px;
  font:400 13px/16px 'Alfa Slab One',Georgia,serif;letter-spacing:.075em;text-transform:uppercase;
  transform-origin:center center;
  color:var(--tier-base,var(--mx));
  background-image:linear-gradient(100deg,var(--tier-base) 0%,var(--tier-base) 34%,var(--tier-glint) 50%,var(--tier-base) 66%,var(--tier-base) 100%);
  background-size:240% 100%;background-position:100% 50%;background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:0 0 var(--glow-low,0px) color-mix(in srgb,var(--tier-glow,var(--mx)) 35%,transparent);
  animation:wordTierReveal .42s cubic-bezier(.2,.85,.25,1) both,wordTierPulse var(--tier-speed,2.8s) ease-in-out infinite alternate,wordTierSway var(--tier-sway-speed,2.8s) cubic-bezier(.45,0,.55,1) infinite alternate;
}
.pill.word-tier::before,.pill.word-tier::after{
  content:"";display:block;flex:0 1 12px;min-width:5px;max-width:12px;height:1px;
  background:linear-gradient(90deg,transparent,var(--tier-glow,var(--mx)));
  opacity:var(--tier-line,.35);transform-origin:center;animation:wordTierLine var(--tier-speed,2.8s) ease-in-out infinite alternate;
}
.pill.word-tier::after{background:linear-gradient(90deg,var(--tier-glow,var(--mx)),transparent)}
.pill.word-tier.tier-3{--tier-base:#b9b2a3;--tier-glint:#f6ead0;--tier-glow:#b9b2a3;--tier-speed:3.4s;--tier-sway-speed:3.8s;--tier-sway-from:-.14deg;--tier-sway-to:.14deg;--glow-low:0px;--glow-high:1px;--glow-wide:2px;--tier-line:.32}
.pill.word-tier.tier-4{--tier-base:#d1c29a;--tier-glint:#fff3cf;--tier-glow:#c5a85d;--tier-speed:3.1s;--tier-sway-speed:3.35s;--tier-sway-from:-.3deg;--tier-sway-to:.3deg;--glow-low:0px;--glow-high:2px;--glow-wide:3px;--tier-line:.42}
.pill.word-tier.tier-5{--tier-base:#e7bd62;--tier-glint:#fff0b5;--tier-glow:var(--mx);--tier-speed:2.8s;--tier-sway-speed:2.95s;--tier-sway-from:-.52deg;--tier-sway-to:.52deg;--glow-low:1px;--glow-high:3px;--glow-wide:4px;--tier-line:.52}
.pill.word-tier.tier-6{--tier-base:#f2c85d;--tier-glint:#fff8d9;--tier-glow:var(--mx);--tier-speed:2.5s;--tier-sway-speed:2.5s;--tier-sway-from:-.82deg;--tier-sway-to:.82deg;--glow-low:1px;--glow-high:4px;--glow-wide:6px;--tier-line:.66}
.pill.word-tier.tier-7{--tier-base:#ffe08a;--tier-glint:#ffffff;--tier-glow:#ffd66e;--tier-speed:2.2s;--tier-sway-speed:2.05s;--tier-sway-from:-1.2deg;--tier-sway-to:1.2deg;--glow-low:2px;--glow-high:5px;--glow-wide:8px;--tier-line:.8}
.pill.word-tier.tier-8{--tier-base:#fff1bd;--tier-glint:#ffffff;--tier-glow:#ffcf59;--tier-speed:1.8s;--tier-sway-speed:1.65s;--tier-sway-from:-1.7deg;--tier-sway-to:1.7deg;--glow-low:2px;--glow-high:7px;--glow-wide:11px;--tier-line:1}
@keyframes wordTierReveal{0%{opacity:0;transform:translateY(3px);letter-spacing:.2em}65%{opacity:1;transform:translateY(0);letter-spacing:.06em}100%{opacity:1;transform:translateY(0);letter-spacing:.075em}}
@keyframes wordTierPulse{from{background-position:100% 50%;text-shadow:0 0 var(--glow-low,0px) color-mix(in srgb,var(--tier-glow,var(--mx)) 35%,transparent)}to{background-position:0% 50%;text-shadow:0 0 var(--glow-high,1px) color-mix(in srgb,var(--tier-glow,var(--mx)) 82%,transparent),0 0 var(--glow-wide,2px) color-mix(in srgb,var(--tier-glow,var(--mx)) 38%,transparent)}}
@keyframes wordTierLine{from{opacity:calc(var(--tier-line,.35)*.55);transform:scaleX(.65)}to{opacity:var(--tier-line,.35);transform:scaleX(1)}}
@keyframes wordTierSway{from{rotate:var(--tier-sway-from,-.14deg)}to{rotate:var(--tier-sway-to,.14deg)}}
@media(prefers-reduced-motion:reduce){.pill.word-tier,.pill.word-tier::before,.pill.word-tier::after{animation:none}.pill.word-tier{background-position:50% 50%;rotate:0deg;text-shadow:0 0 var(--glow-high,1px) color-mix(in srgb,var(--tier-glow,var(--mx)) 70%,transparent)}}
.tray{display:grid;grid-template-columns:repeat(8,var(--tw));gap:4px;padding:6px;border:1px solid var(--ln);border-radius:4px}
.slot{width:var(--tw);height:var(--th);border:1px dashed var(--ln);border-radius:3px}.slot.f{border:0}
.slot.drop-target{border:1px solid var(--mx);background:color-mix(in srgb,var(--mx) 13%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--mx) 20%,transparent)}
.slot.drag-source{border:1px dashed var(--mx);background:color-mix(in srgb,var(--mx) 7%,transparent)}
.tray .tl.dragging-tray-tile{position:fixed!important;z-index:1000!important;pointer-events:none!important;opacity:.98;transform:scale(1.1) rotate(-3deg)!important;transition:none!important;filter:brightness(1.06);box-shadow:0 8px 24px #0008,0 0 0 2px var(--mx)}
.eq{display:flex;gap:14px;align-items:baseline;justify-content:center}
.pt{text-align:center;min-width:92px;color:var(--ti)}.pt.m{color:var(--ca)}
.pt small{display:block;font:500 8px 'Chivo Mono',ui-monospace,monospace;letter-spacing:.3em;color:var(--mu)}
.pt{position:relative}.pt b{display:block;font:700 30px/1.05 'Alfa Slab One',Georgia,serif;font-variant-numeric:tabular-nums}.pt b.pop{animation:tallyHit .46s cubic-bezier(.2,.9,.25,1.25)}.pt.m b.pop{animation-name:tallyHitM}
.xx{position:relative;top:22px;transform:translateY(0);color:var(--mu);font:300 22px 'Alfa Slab One',Georgia,serif}
.tot{min-height:32px;font:700 28px/1.1 'Alfa Slab One',Georgia,serif}.tot.pv{color:var(--mu);font-size:20px}.tot.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.5)}}

/* Contagem de pontos: número rola, brilha e ganha uma barra de impacto a cada carta/poder. */
@keyframes tallyHit{0%{transform:scale(1);filter:none}28%{transform:scale(1.4) translateY(-3px);filter:brightness(1.55);text-shadow:0 0 14px currentColor,0 0 32px color-mix(in srgb,currentColor 55%,transparent)}100%{transform:scale(1);filter:none;text-shadow:0 0 0 transparent}}
@keyframes tallyHitM{0%{transform:scale(1) rotate(0);filter:none}28%{transform:scale(1.48) translateY(-4px) rotate(-3deg);filter:brightness(1.55);text-shadow:0 0 16px currentColor,0 0 36px color-mix(in srgb,currentColor 60%,transparent)}100%{transform:scale(1) rotate(0);filter:none;text-shadow:0 0 0 transparent}}
.pt:has(b.pop)::after{content:"";position:absolute;left:14%;right:14%;bottom:-6px;height:2px;border-radius:2px;background:currentColor;box-shadow:0 0 10px currentColor;transform-origin:left;animation:tallyBar .46s ease-out both}
@keyframes tallyBar{0%{transform:scaleX(0);opacity:1}65%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
.tl.hl{animation:tileTally .44s cubic-bezier(.2,.9,.25,1.2) both;box-shadow:0 0 0 2px var(--mx),0 0 24px color-mix(in srgb,var(--mx) 70%,transparent),0 7px 0 #0005}
@keyframes tileTally{0%{transform:translateY(0) scale(1);filter:none}34%{transform:translateY(-22px) scale(1.26) rotate(-3deg);filter:brightness(1.4) saturate(1.25)}68%{transform:translateY(-12px) scale(1.12) rotate(1.5deg)}100%{transform:translateY(-14px) scale(1.15);filter:none}}
@media(prefers-reduced-motion:reduce){.pt b.pop,.pt:has(b.pop)::after,.tl.hl{animation:none!important}}
.msg{font-size:11px;min-height:14px;text-align:center;color:var(--mx)}
.tl{position:relative;width:var(--tw);height:var(--th);border:0;padding:0;border-radius:3px;cursor:pointer;background:var(--pp);color:var(--pk);font:700 calc(var(--tw)*.64)/1 'Alfa Slab One',Georgia,serif;display:grid;place-items:center;box-shadow:0 3px 0 var(--ps);transition:transform .12s}
.tl small{position:absolute;right:3px;bottom:2px;font:600 calc(var(--tw)*.22) 'Chivo Mono',ui-monospace,monospace;opacity:.55}
.tl:active{transform:translateY(2px)}
.tl.gd{background:var(--ti);color:var(--bg);box-shadow:0 3px 0 var(--gs),0 0 16px var(--gg)}
.tl.rb{background:var(--ca);color:#fff;box-shadow:0 3px 0 #a8321b}
.tl.cr{background:var(--mx);color:#1a1200;box-shadow:0 3px 0 #a8730c}
.tl.sg{transform:rotate(calc(var(--k)*1deg))}
.tl.hl{transform:translateY(-14px) scale(1.15);z-index:6}
.tl.bn{opacity:.25}.tl.bn::before{content:"×";position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--tw)*.9);color:var(--ca);z-index:2}
 .tl.nw{animation:deal .45s cubic-bezier(.2,.9,.3,1.1) backwards;animation-delay:calc(var(--d)*50ms)}
/* Troca de letras: efeito próprio, reproduzido também no convidado do Coop. */
.coop-swap-hidden{opacity:0!important;animation:none!important}
.coop-swap-ghost{position:fixed!important;z-index:1200!important;margin:0!important;pointer-events:none!important;transition:none!important;animation:none!important;will-change:transform,opacity,left,top;}
@keyframes deal{from{opacity:0;translate:45vw 30vh;rotate:30deg;scale:.6}}
.handw{flex:1;display:flex;flex-direction:column;justify-content:center;gap:6px;min-height:calc(var(--th) + 12px)}
.hand{display:flex;flex-wrap:wrap;gap:9px 4px;justify-content:center}
.hand .tl,.tray .tl{touch-action:none}
.hand-placeholder{flex:0 0 auto;border:1px dashed var(--mx);border-radius:4px;background:color-mix(in srgb,var(--mx) 12%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--mx) 20%,transparent)}
.hand .tl.dragging-hand-tile{position:fixed!important;z-index:1000!important;pointer-events:none!important;opacity:.98;transform:scale(1.1) rotate(-3deg)!important;transition:none!important;filter:brightness(1.06);box-shadow:0 8px 24px #0008,0 0 0 2px var(--mx)}
.deckn{text-align:center;font-size:9px;letter-spacing:.2em;color:var(--mu)}
.btns{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:6px}
.btn{height:46px;border:1px solid var(--ln);border-radius:3px;background:none;color:var(--tx);font:600 10px 'Chivo Mono',ui-monospace,monospace;letter-spacing:.16em;cursor:pointer}
.btn:active{transform:translateY(1px)}.btn:disabled{opacity:.35}
.go{background:var(--tx);color:var(--bg);border-color:var(--tx)}.dc{color:var(--ca);border-color:#ff5a3d77}.hn{color:var(--mx);border-color:#ffb21f77}
.ov{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:6px 0 16px}
.ov p{margin:0;max-width:340px;color:color-mix(in srgb,var(--tx) 75%,var(--bg));line-height:1.5}
.logo{--tw:calc((min(100vw,480px) - 48px)/6);display:flex;flex-direction:column;gap:6px;align-items:center;margin:22px 0 4px}
.lrow{display:flex;gap:5px}.lrow .tl{cursor:default}
.sub{font-size:9px;letter-spacing:.36em;color:var(--mu)}
.dk{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%}
.dkc{padding:10px;text-align:left;background:none;border:1px solid var(--ln);border-radius:3px;color:var(--tx);font:inherit;cursor:pointer}
.dkc.sel{border-color:var(--tx)}
.dkc b{display:block;font:700 14px 'Alfa Slab One',Georgia,serif}.dkc small{display:block;font-size:10px;color:var(--mu);margin-top:3px;line-height:1.35}
.big{border:0;border-radius:3px;padding:14px 34px;font:700 12px 'Chivo Mono',ui-monospace,monospace;letter-spacing:.26em;color:var(--bg);background:var(--tx);cursor:pointer}
.big:active{transform:translateY(2px)}.big.alt{background:none;border:1px solid var(--ln);color:var(--tx);padding:11px 22px;font-size:10px}
.hdr2{display:flex;align-items:center;justify-content:space-between;width:100%}

/* Tela inicial: o cenário animado continua livre; a interface fica em uma composição curta. */
.title-head{width:min(100%,440px);margin:0 auto}
.title-screen{width:100%;max-width:440px;margin:0 auto;padding:0 2px 18px;gap:10px}
.title-screen .logo{margin:clamp(10px,4vh,30px) 0 1px;gap:5px}
.title-screen .sub{font-size:8px;letter-spacing:.3em;color:var(--mu);margin-bottom:8px}
.title-screen .steps{display:none}
.title-screen .lbl{display:flex;align-items:center;justify-content:space-between;margin:5px 1px 0;padding:0 0 5px;font-size:8px;letter-spacing:.22em}
.title-screen .dk{gap:6px}
.title-screen .dkc{min-height:58px;padding:8px 10px;border-radius:4px;background:color-mix(in srgb,var(--tx) 2%,var(--bg));transition:border-color .16s,background .16s,transform .16s}

.title-screen .big{width:min(100%,320px);margin-top:4px;padding:14px 20px;letter-spacing:.22em}
.title-screen .title-record{max-width:100%;margin:1px 0 0;font-size:8px;line-height:1.45;color:var(--mu);text-align:center}
@media(max-width:390px){
  .title-screen{gap:8px}
  .title-screen .logo{margin-top:8px}
  .title-screen .dk{gap:5px}
  .title-screen .dkc{min-height:54px;padding:7px 8px}
  .title-screen .dkc b{font-size:12px}
  .title-screen .dkc small{font-size:8px}
}
@media(max-width:600px) and (max-height:700px){
  .title-screen .logo{margin-top:2px}

  .title-screen .sub{margin-bottom:3px}

}

/* Ajustes pontuais: mesma moldura de raridade na loja, na partida e nos poderes comprados. */

  --q:#a6a69f;--ink:#25282b;--ink2:#62656a;--pg:#24784f;--pap:#fff;
  position:relative;isolation:isolate;background:#fff!important;color:#25282b;
  border:1px solid #d9d9d4;border-radius:8px;
  box-shadow:inset 0 3px 0 var(--q),0 3px 8px #0002;
}
.shop .cd.q0,.rs.on.q0{--q:#a6a69f;border-color:#d9d9d4}
.shop .cd.q1,.rs.on.q1{--q:#4785ba;border-color:#8db8d7;box-shadow:inset 0 3px 0 #4785ba,0 3px 8px #0002}
.shop .cd.q2,.rs.on.q2{--q:#8b6ac2;border-color:#b7a4d8;background:#fff!important;box-shadow:inset 0 3px 0 #8b6ac2,0 3px 8px #0002}
.shop .cd:not(.empty)::before,.rs.on::before{
  inset:4px;border:1px solid color-mix(in srgb,var(--q) 38%,#fff);
  border-radius:5px;pointer-events:none
}
.shop .cd.q1::before,.rs.on.q1::before{border-color:#d4e5f1}
.shop .cd.q2::before,.rs.on.q2::before{border-color:#e4daf2}

.btn.dk2::before{border-color:#170d29;box-shadow:3px 3px 0 -1px var(--ex),3px 3px 0 0 #170d29}
.btn.dk2 .cnt{background:var(--bg);color:var(--ex);border:1px solid var(--bg)}
.btn[data-a="clr"]{background:#d9d3c5;color:#191812;border-color:#eee8da;box-shadow:0 3px 0 #8b8373}.btn[data-a="clr"]:hover{filter:brightness(1.06)}.btn[data-a="clr"]:focus-visible{outline:2px solid var(--mx);outline-offset:3px}

/* ================= LOJA (layout compacto: poderes comprados no topo, vitrine com botões ao lado) ================= */
.shop{--pn:color-mix(in srgb,var(--tx) 5%,var(--bg));--well:color-mix(in srgb,var(--bg) 78%,#000);--edge:color-mix(in srgb,var(--tx) 14%,var(--bg));width:100%;align-items:stretch;gap:8px;text-align:left;padding:2px 0 16px}
.shop button{touch-action:manipulation;-webkit-touch-callout:none}
.shop .hdr2{padding:0 2px;align-items:flex-end}
.shop .hdr2 h2{font-size:27px;line-height:1}
.shop .hdr2 .st{font-size:19px;line-height:1;padding:0;min-width:0;text-align:right}
.shop .hdr2 .st small{font-size:8px;margin-bottom:3px}

/* faixa de informações da próxima fase */
.shp-info{display:flex;flex-direction:column;gap:6px;padding:9px 11px;border:1px solid var(--edge);border-radius:9px;background:var(--pn)}
.shp-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.shp-next,.shp-meta{font:600 9px 'Chivo Mono',ui-monospace,monospace;letter-spacing:.14em;color:var(--mu)}
.shp-next b{font-size:15px;color:var(--tx);letter-spacing:0;margin-left:3px}
.shp-meta b{font-size:13px;color:var(--tx);letter-spacing:0;margin-left:3px}
.shp-pay{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px;font-size:10px;line-height:1.4;color:var(--mu)}
.shp-pay i{font:600 8px 'Chivo Mono',ui-monospace,monospace;letter-spacing:.18em;font-style:normal}
.shp-pay b{font-weight:700;color:var(--mo);margin-left:2px}
.shp-boss{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:center;gap:3px 6px;padding:0;margin:0;font-size:10px;line-height:1.35;color:var(--mu)}
.shp-boss-label{font:600 10px 'Chivo Mono',ui-monospace,monospace;color:var(--mu);letter-spacing:0}
.shp-boss-name{font:700 11px 'Chivo Mono',ui-monospace,monospace;color:var(--ca)!important;letter-spacing:0}
.shp-msg{min-height:15px;margin:-2px 0;text-align:center;font-size:10.5px;line-height:1.4;color:var(--mx)}
.shp-msg.bad{color:var(--ca)}

/* painéis */
.shp-panel{padding:8px;border:1px solid var(--edge);border-radius:11px;background:var(--pn)}
.shp-head{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:26px;padding:0 3px 6px}
.shp-t{display:flex;align-items:baseline;gap:7px}
.shp-t b{font:700 9px 'Chivo Mono',ui-monospace,monospace;letter-spacing:.18em;color:var(--tx)}
.shp-t em{font:600 10px 'Chivo Mono',ui-monospace,monospace;font-style:normal;color:var(--mu)}
.shp-head small{font-size:8.5px;letter-spacing:.03em;line-height:1.3;color:var(--mu);text-align:right}
.h-mouse{display:none}
@media(hover:hover) and (pointer:fine){.h-touch{display:none}.h-mouse{display:inline}}
 .shp-sell{display:inline-flex;align-items:center;gap:6px;padding:5px 2px;border:0;border-bottom:1px solid color-mix(in srgb,var(--ca) 38%,transparent);border-radius:0;background:transparent;color:var(--mu);font:700 8.5px 'Chivo Mono',ui-monospace,monospace;letter-spacing:.13em;cursor:pointer;transition:color .15s,border-color .15s,transform .15s}
.shp-sell i{font:400 17px/1 'Chivo Mono',monospace;font-style:normal;color:var(--ca)}
.shp-sell b{font-size:10px;color:var(--coin);letter-spacing:0}
.shp-sell:active{transform:translateY(1px)}
@media(hover:hover){.shp-sell:hover{color:var(--tx);border-color:var(--ca)}}

/* poderes comprados */
.shp-owned .rel{padding:9px 6px;border-radius:8px;background:var(--well)}
.shp-owned .rs{--rh:76px}
.rs.buy{animation:buy .55s cubic-bezier(.2,.9,.3,1.3)}
@keyframes buy{0%{scale:.3;rotate:-14deg;opacity:0}60%{scale:1.18;rotate:3deg;opacity:1}100%{scale:1;rotate:0}}

/* vitrine: botões à esquerda, cartas à direita */
.shp-market{display:flex;flex-direction:column;gap:8px;border-color:color-mix(in srgb,var(--ca) 42%,var(--edge))}
.shp-grid{display:grid;grid-template-columns:clamp(70px,21%,96px) minmax(0,1fr);gap:8px}
.shp-actions{display:flex;flex-direction:column;gap:8px}
.shp-go,.shp-roll{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:54px;padding:6px 4px;border-radius:9px;font:700 10px/1.15 'Chivo Mono',ui-monospace,monospace;letter-spacing:.12em;text-align:center;cursor:pointer}
.shp-go{flex:1;border:0;background:var(--mx);color:#16140f;box-shadow:0 3px 0 color-mix(in srgb,var(--mx) 62%,#000);transition:transform .1s,box-shadow .1s}
.shp-go b{font:700 15px/1 'Chivo Mono',ui-monospace,monospace;letter-spacing:.04em}
.shp-go:active{transform:translateY(3px);box-shadow:0 0 0 color-mix(in srgb,var(--mx) 62%,#000)}
.shp-roll{border:0;background:var(--ex);color:#16140f;box-shadow:0 3px 0 color-mix(in srgb,var(--ex) 62%,#000);transition:transform .1s,box-shadow .1s,opacity .2s}
.shp-roll svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.shp-roll .rc{font:700 15px/1 'Chivo Mono',ui-monospace,monospace;color:inherit;letter-spacing:.04em}
.shp-roll:active{transform:translateY(3px);box-shadow:0 0 0 color-mix(in srgb,var(--ex) 62%,#000)}
.shp-roll.off{opacity:.45}
.shp-offers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:8px 6px 9px;border-radius:9px;background:var(--well)}
.shp-slot{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.shp-slot.deal{animation:sdeal .5s cubic-bezier(.2,.9,.3,1.15) backwards;animation-delay:calc(var(--i)*70ms)}
@keyframes sdeal{from{opacity:0;translate:0 16px;scale:.86;rotate:-4deg}}
.ptag{font:700 12px/1 'Chivo Mono',ui-monospace,monospace;color:var(--mo);padding:4px 10px;border-radius:99px;border:1px solid color-mix(in srgb,var(--mo) 45%,transparent);background:color-mix(in srgb,var(--mo) 10%,var(--well));letter-spacing:0}
.ptag.low{opacity:.5}
.ptag.gh{visibility:hidden}

/* carta da loja: só letra e nome (detalhes aparecem no balão ao segurar) */
.shop .cd{position:relative;display:flex;flex-direction:column;align-items:center;width:100%;aspect-ratio:3/4;min-height:0;padding:6px 4px;text-align:center;cursor:pointer;font:inherit;transition:transform .15s,opacity .2s,filter .2s}
.shop .cd.empty{background:none!important;border:1px dashed var(--edge);box-shadow:none;cursor:default}
.shop .cd.empty::before{display:none}
.shop .cd .tp{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;width:100%;height:12px;padding:0 3px}
.shop .cd .art{flex:1;min-height:0;width:100%;--af:clamp(30px,9.5vw,44px);margin:3px 0;border-radius:5px;background:linear-gradient(180deg,#fff,#f8f8f5);border:1px solid #efefeb;overflow:hidden}
.shop .cd .nm{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;min-height:2.35em;font:400 clamp(8px,2.3vw,9.5px)/1.15 'Alfa Slab One',Georgia,serif;letter-spacing:.03em;text-transform:uppercase;color:#202326;overflow-wrap:anywhere}
.shop .cd.off{opacity:.5;filter:saturate(.7)}
.shop .cd:not(.off):active{transform:translateY(1px) scale(.97)}
@media(hover:hover){.shop .cd:not(.off):hover{transform:translateY(-4px) rotate(-1.2deg)}}
.nope{animation:nope .38s}
@keyframes nope{20%,60%{translate:-4px 0}40%,80%{translate:4px 0}}

/* melhorias de letras: mini-peças iguais às do jogo */
.shp-letters{padding:6px 8px 9px;border-radius:9px;background:var(--well)}
.shp-letters .shp-head{min-height:22px;padding:0 1px 4px}
.shp-ups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.shp-up{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:3px 0 5px;border:0;background:none;color:var(--tx);text-align:left;cursor:pointer;font:inherit}
.shp-up .tl{--tw:32px;--th:42px;flex:none;cursor:inherit;transition:transform .15s}
.shp-up .tx{display:flex;flex-direction:column;gap:3px;min-width:0}
.shp-up .tx b{font:700 10px/1.1 'Chivo Mono',ui-monospace,monospace;letter-spacing:.02em}
.shp-up .tx small{font:500 8.5px/1.15 'Chivo Mono',ui-monospace,monospace;color:var(--mu)}
.shp-up.off{opacity:.5}
.shp-up:not(.off):active .tl{transform:translateY(2px)}
@media(hover:hover){.shp-up:not(.off):hover .tl{transform:translateY(-3px) rotate(-4deg)}}
@media(max-width:380px){.shp-up{gap:5px}.shp-up .tx small{font-size:8px}}
@media(max-width:340px){
  .shp-grid{grid-template-columns:1fr}
  .shp-actions{flex-direction:row}
  .shp-go,.shp-roll{flex-direction:row;gap:7px;min-height:44px}
  .shp-up .tl{--tw:28px;--th:38px}
}

/* balão de detalhes (fundo branco): aparece ao segurar a carta ou passar o mouse */
#tip{position:fixed;z-index:90;left:0;top:0;width:min(252px,calc(100vw - 16px));padding:11px 12px;border-radius:11px;background:#fff;color:#1d1f22;font:12px/1.4 'Chivo Mono',ui-monospace,monospace;text-align:left;box-shadow:0 10px 30px #000b,0 0 0 1px #0000001f;pointer-events:none;opacity:0;visibility:hidden;transform:translateY(5px) scale(.95);transform-origin:var(--ax,50%) 100%;transition:opacity .14s,transform .17s cubic-bezier(.2,.9,.3,1.2),visibility 0s linear .17s}
#tip[data-pos=bottom]{transform-origin:var(--ax,50%) 0}
#tip.on{opacity:1;visibility:visible;transform:none;transition-delay:0s}
#tip::after{content:"";position:absolute;left:var(--ax,50%);width:12px;height:12px;background:#fff;rotate:45deg;translate:-50% 0}
#tip[data-pos=top]::after{bottom:-6px;box-shadow:2px 2px 2px #0000001a}
#tip[data-pos=bottom]::after{top:-6px;box-shadow:-2px -2px 2px #0000001a}
#tip .th{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-bottom:8px;border-bottom:1px solid #ecece8}
#tip .tn{font:400 13px/1.15 'Alfa Slab One',Georgia,serif;letter-spacing:.03em;text-transform:uppercase}
#tip .tr{flex:none;padding:3px 6px;border:1px solid;border-radius:4px;font:700 8px/1 'Chivo Mono',ui-monospace,monospace;letter-spacing:.1em}

#tip .tr.q1{color:#3978ac;background:#f0f7fc;border-color:#c5dced}
#tip .tr.q2{color:#7855b1;background:#f6f0ff;border-color:#ded0f1}
#tip .ts{padding-top:9px}
#tip .ts small{display:block;margin-bottom:5px;font:700 7.5px 'Chivo Mono',ui-monospace,monospace;letter-spacing:.2em;color:#8a8d90}
#tip .tb{display:flex;align-items:flex-start;gap:8px;font-size:11px;line-height:1.4;color:#34373a}
#tip .tk{flex:none;display:inline-flex;align-items:center;gap:4px;padding:3px 7px 3px 5px;border-radius:4px;background:color-mix(in srgb,var(--c) 13%,#fff);color:var(--c);font:700 9px/1.2 'Chivo Mono',ui-monospace,monospace;letter-spacing:.05em;white-space:nowrap}
#tip .tk .kg{width:11px;height:11px;stroke:currentColor}
#tip p{margin:0;font-size:11.5px;line-height:1.45;color:#34373a}
#tip .tw{margin-top:10px;padding:6px 8px;border-radius:5px;background:#fff1ec;color:#b3361b;font-size:10px;font-weight:600;line-height:1.35}

/* acessibilidade: foco visível no teclado e respeito a "reduzir movimento" */
.shop button:focus-visible{outline:2px solid var(--mx);outline-offset:2px}

/* animação ao comprar melhoria de letra */
.upov{position:fixed;inset:0;z-index:39;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:radial-gradient(circle at 50% 45%,rgba(0,0,0,.5),rgba(0,0,0,.78) 80%);animation:upbg 2.65s ease both}
@keyframes upbg{0%{opacity:0}10%{opacity:1}88%{opacity:1}100%{opacity:0}}
.upc{position:relative;width:112px;aspect-ratio:3/4}
.uf{position:absolute;inset:0;border-radius:10px;display:grid;place-items:center;overflow:hidden;box-shadow:0 0 0 1px var(--ps),0 14px 32px #000a}
.uf b{font:700 58px/1 'Alfa Slab One',Georgia,serif}
.uf i{position:absolute;left:8px;top:6px;font:700 12px 'Chivo Mono',monospace;font-style:normal}
.uf i.b{left:auto;top:auto;right:8px;bottom:6px;rotate:180deg}
.uf.f0{background:var(--pp);color:var(--pk)}
.uf.f0.ra{background:linear-gradient(160deg,#f0e8ff,#b794f6);color:#1b0c36;--ps:#6b49b8}
.uf.f1{opacity:0}
.u-g .f1{background:linear-gradient(160deg,#ffffff,#d6dbe1);color:#14161a;box-shadow:0 0 0 1px #9aa0a6,0 0 38px #fff9,0 14px 32px #000a}
.u-r .f1{background:linear-gradient(160deg,#ff9a78,#e2431f);color:#fff;box-shadow:0 0 0 1px #a8321b,0 0 38px #ff5a3d99,0 14px 32px #000a}
.u-k .f1{background:linear-gradient(160deg,#ffe08a,#ffb21f);color:#1a1200;box-shadow:0 0 0 1px #a8730c,0 0 38px #ffb21f99,0 14px 32px #000a}
.ush{position:absolute;inset:0;border-radius:10px;overflow:hidden;pointer-events:none}
.ush em{position:absolute;top:-10%;left:0;width:38%;height:120%;background:linear-gradient(90deg,transparent,#ffffffd9,transparent);translate:-160% 0;skew:-18deg}
.upt{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;opacity:0}
.upt small{font:500 10px 'Chivo Mono',monospace;letter-spacing:.32em;color:#d8d3c6}
.upt b{font:700 30px/1 'Alfa Slab One',Georgia,serif;color:var(--uc);text-shadow:0 0 22px var(--uc),0 3px 0 #0008}
.upt span{font:700 13px 'Chivo Mono',monospace;color:#fff;letter-spacing:.06em}
.shp-up.pu .tl{animation:upk .86s cubic-bezier(.2,.9,.3,1.2)}
@keyframes upk{0%{transform:none}34%{transform:translateY(-13px) rotate(-11deg) scale(1.32)}68%{transform:translateY(1px) rotate(4deg) scale(.94)}100%{transform:none}}
@media(prefers-reduced-motion:reduce){
  .shp-up.pu .tl{animation:none}
  .shp-slot.deal,.rs.buy,.nope{animation:none}
  .shop .cd,.shp-go,.shp-roll,.shp-up .tl,#tip{transition:none}
  .shop .cd:not(.off):hover,.shp-up:not(.off):hover .tl{transform:none}
}

/* ================= COOP EXPERIMENTAL + RESPONSIVIDADE DESKTOP ================= */
.coop-help{float:right;width:24px;height:24px;display:inline-grid;place-items:center;border:1px solid color-mix(in srgb,var(--mu) 45%,transparent);border-radius:50%;background:transparent;color:var(--mu);font:600 12px 'Chivo Mono',monospace;cursor:pointer;opacity:.72;transition:opacity .15s,border-color .15s}
.coop-help:hover,.coop-help:focus-visible{opacity:1;border-color:var(--mx);color:var(--mx);outline:none}
.coop-modal{position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 14px max(16px,env(safe-area-inset-bottom));background:#080809d9;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);overflow:auto}
.coop-panel{width:min(100%,480px);max-height:100%;overflow:auto;border:1px solid var(--ln);border-radius:12px;background:var(--bg);box-shadow:0 24px 80px #0009;padding:clamp(18px,4vw,28px);display:flex;flex-direction:column;gap:14px;text-align:left}
.coop-panel-top{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--mu);font-size:9px;letter-spacing:.22em}
.coop-panel h2{font:700 clamp(26px,7vw,36px)/1.05 'Alfa Slab One',Georgia,serif;margin:0;color:var(--tx)}
.coop-panel p{font:11px/1.55 'Chivo Mono',monospace;color:var(--mu);margin:0}
.coop-actions{display:grid;grid-template-columns:1fr;gap:8px}
.coop-action{min-height:46px;padding:12px 14px;border:1px solid var(--ln);border-radius:6px;background:transparent;color:var(--tx);font:600 11px 'Chivo Mono',monospace;letter-spacing:.08em;text-align:center;cursor:pointer}
.coop-action.primary{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.coop-action.warn{color:var(--ca);border-color:color-mix(in srgb,var(--ca) 55%,var(--ln))}
.coop-action:disabled{opacity:.45;cursor:wait}
.coop-code{font:700 clamp(26px,9vw,40px)/1 'Chivo Mono',monospace;letter-spacing:.16em;text-align:center;padding:18px 6px;border:1px dashed var(--mx);border-radius:8px;color:var(--mx);overflow-wrap:anywhere}
.coop-field{width:100%;min-width:0;height:48px;border:1px solid var(--ln);border-radius:6px;background:color-mix(in srgb,var(--tx) 4%,var(--bg));color:var(--tx);padding:0 14px;font:700 18px 'Chivo Mono',monospace;letter-spacing:.14em;text-align:center;text-transform:uppercase;outline:none}
.coop-field:focus{border-color:var(--mx);box-shadow:0 0 0 2px color-mix(in srgb,var(--mx) 18%,transparent)}
.coop-note{font-size:10px!important;color:var(--mu)!important;min-height:14px}

/* Chat do Coop: um botão discreto + painel enxuto, no idioma visual do jogo (papel, ouro, Chivo Mono). */
.cc-launch{position:fixed;z-index:1800;right:max(10px,env(safe-area-inset-right));bottom:calc(max(8px,env(safe-area-inset-bottom)) + var(--vvb,0px));width:40px;height:40px;display:grid;place-items:center;padding:0;border:1px solid var(--ln);border-radius:4px;background:color-mix(in srgb,var(--bg) 90%,transparent);color:var(--mu);cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .18s cubic-bezier(.2,.9,.3,1.2),opacity .15s,background .2s,color .2s,border-color .2s,box-shadow .2s}
.cc-launch svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cc-launch:hover,.cc-launch:focus-visible{color:var(--tx);border-color:color-mix(in srgb,var(--mx) 50%,var(--ln));outline:none}
.cc-launch:active{transform:translateY(2px)}
.cc-launch.hide{opacity:0;pointer-events:none;transform:scale(.6)}
.cc-launch.un{background:var(--pp);color:var(--pk);border-color:var(--pp);box-shadow:0 3px 0 var(--ps);animation:ccNudge .55s}
.cc-launch i{position:absolute;top:-7px;right:-7px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--mx);color:#1a1200;font:700 9px/17px 'Chivo Mono',monospace;text-align:center;font-style:normal}
.cc-launch u{position:absolute;top:-3px;left:-3px;width:8px;height:8px;border-radius:50%;background:var(--mu);animation:ccPulse 1.4s infinite;text-decoration:none}
.cc-launch u.er{background:var(--ca)}.cc-launch u.wr{background:var(--mx)}
@keyframes ccNudge{0%{transform:scale(.8)}30%{transform:scale(1.14) rotate(-7deg)}55%{transform:rotate(5deg)}80%{transform:rotate(-2deg)}100%{transform:none}}
@keyframes ccPulse{50%{opacity:.3}}
@keyframes ccIn{from{opacity:0;transform:translateY(10px) scale(.97)}}
@keyframes ccOut{to{opacity:0;transform:translateY(8px) scale(.97)}}
@keyframes ccMsg{from{opacity:0;transform:translateY(5px)}}
@keyframes ccToast{0%{opacity:0;transform:translateX(18px) rotate(2deg)}60%{transform:translateX(-3px)}100%{opacity:1;transform:none}}
.cc-toast{position:fixed;z-index:1850;right:calc(max(10px,env(safe-area-inset-right)) + 48px);bottom:calc(max(8px,env(safe-area-inset-bottom)) + var(--vvb,0px));width:min(250px,calc(100vw - 84px));min-width:120px;max-width:min(290px,calc(100vw - 80px));min-height:40px;padding:8px 11px 8px 10px;display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:8px;border:0;border-left:3px solid var(--mx);border-radius:12px;background:var(--pp);color:var(--pk);box-shadow:0 3px 0 var(--ps),0 10px 28px #0007;text-align:left;cursor:pointer;animation:ccToast .38s cubic-bezier(.2,.9,.3,1.1)}
.cc-toast.out{animation:ccOut .2s forwards;pointer-events:none}

/* Novas melhorias: identidade material discreta, reconhecível na loja e nas letras. */
.skin-a{background:linear-gradient(145deg,#fbfcfd,#c9d2dc 48%,#737f8a)!important;color:#18202a!important;box-shadow:inset 0 0 0 1px #ffffffa8,0 3px 0 #67717d!important;border:1px solid #eef2f5!important}
.skin-e{background:linear-gradient(145deg,#effff5,#78c9a0 50%,#286b50)!important;color:#102b20!important;box-shadow:inset 0 0 0 1px #ffffff75,0 3px 0 #20583f!important;border:1px solid #c8ffe0!important}
.skin-z{background:linear-gradient(145deg,#f6f0ff,#a98af0 48%,#4a2d8d)!important;color:#20143b!important;box-shadow:inset 0 0 0 1px #ffffff88,0 3px 0 #412677!important;border:1px solid #e5d7ff!important}
.skin-m{background:linear-gradient(145deg,#f4fffc,#91d8c3 48%,#347d75)!important;color:#12302d!important;box-shadow:inset 0 0 0 1px #ffffff88,0 3px 0 #2b625b!important;border:1px solid #d8fff5!important}
/* Modo Bia: opção explícita na criação da sala, sem mexer no modo solo. */
.bia-toggle{display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid color-mix(in srgb,var(--mx) 35%,var(--ln));border-radius:7px;background:color-mix(in srgb,var(--mx) 5%,var(--bg));cursor:pointer}
.bia-toggle input{flex:none;width:17px;height:17px;margin:0;accent-color:var(--mx)}
.bia-toggle span{display:flex;flex-direction:column;gap:4px;min-width:0}
.bia-toggle b{font:700 10px 'Chivo Mono',monospace;letter-spacing:.16em;color:var(--mx)}
.bia-toggle small{font:10px/1.4 'Chivo Mono',monospace;color:var(--mu)}
/* Recompensa de fase em ouro gravado, no lugar do texto verde comum. */
.bn.money span{color:var(--mx);font-weight:700;letter-spacing:.13em;text-shadow:0 0 12px color-mix(in srgb,var(--mx) 24%,transparent)}
.bn.money b{color:var(--tx);text-shadow:0 2px 0 color-mix(in srgb,var(--bg) 80%,transparent),0 0 20px color-mix(in srgb,var(--mx) 20%,transparent)}
.bn.money span{animation:moneyShine 1.1s ease-in-out both}
@keyframes moneyShine{0%{opacity:.35;letter-spacing:.08em}45%{opacity:1;letter-spacing:.16em}100%{opacity:1;letter-spacing:.13em}}
/* Venda: aviso tipográfico pequeno, sem caixa verde genérica. */
.shp-sell-notice{display:flex;align-items:baseline;justify-content:center;flex-wrap:wrap;gap:4px 9px;min-height:18px;margin:-2px 0 0;padding:2px 4px;font:600 9px/1.25 'Chivo Mono',monospace;animation:sellNoticeIn .22s ease-out both}
.ssn-label{font-size:7px;letter-spacing:.17em;color:var(--mu)}
.ssn-name{color:var(--tx);letter-spacing:.02em}
.ssn-value{padding-left:8px;border-left:1px solid color-mix(in srgb,var(--mx) 45%,var(--ln));font-size:11px;color:var(--mx);font-weight:700}
@keyframes sellNoticeIn{from{opacity:0;translate:0 3px}to{opacity:1;translate:0 0}}
@media(prefers-reduced-motion:reduce){.bn.money span,.shp-sell-notice{animation:none!important}}


/* Post-it: pequeno achado de papel, dentro da própria vitrine. */
.shp-postit-wrap{display:flex;flex-direction:column;gap:5px;padding:2px 2px 0;animation:postitIn .48s cubic-bezier(.2,.85,.25,1.15) both}
.shp-postit-label{padding-left:3px;font:700 7px 'Chivo Mono',monospace;letter-spacing:.2em;color:var(--mu)}
.shp-postit{--note:#e9d9a9;position:relative;isolation:isolate;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;min-height:58px;padding:9px 13px 9px 12px;overflow:hidden;border:1px solid #bba46d;border-left:3px solid #c59d3e;border-radius:3px;background:linear-gradient(112deg,#f0e4bf 0%,#e8d8aa 72%,#dfcb96 100%);color:#292319;text-align:left;font:inherit;cursor:pointer;box-shadow:0 2px 0 #76633d,0 5px 12px #0002;transition:transform .15s,filter .15s}
.shp-postit::after{content:"";position:absolute;z-index:-1;right:0;top:0;width:15px;height:15px;background:linear-gradient(225deg,#b9a16b 0 49%,#d6c28e 50%);clip-path:polygon(0 0,100% 100%,100% 0);opacity:.8}
.shp-postit:active:not(.off){transform:translateY(2px);box-shadow:0 0 0 #76633d,0 2px 7px #0002}
.shp-postit.off{opacity:.5;filter:saturate(.55)}
.shp-postit-copy{display:flex;flex-direction:column;gap:3px;min-width:0}
.shp-postit-copy b{font:700 10px/1.15 'Chivo Mono',monospace;letter-spacing:.015em;color:#282217}
.shp-postit-copy small{font:500 8px/1.3 'Chivo Mono',monospace;color:#625536;overflow-wrap:anywhere}
.shp-postit-cost{align-self:center;white-space:nowrap;color:#755516;font:700 11px 'Chivo Mono',monospace}
.shp-note-tags{display:flex;flex-wrap:wrap;gap:5px;padding-top:7px;margin-top:3px;border-top:1px solid color-mix(in srgb,var(--tx) 9%,var(--ln))}
.shp-note-tags span{display:inline-flex;align-items:center;gap:4px;padding:3px 6px;border:1px solid color-mix(in srgb,var(--mx) 28%,var(--ln));border-radius:3px;background:color-mix(in srgb,var(--mx) 5%,transparent);color:var(--mu);font:500 7px 'Chivo Mono',monospace;letter-spacing:.02em}
@keyframes postitIn{from{opacity:0;translate:0 8px;rotate:-1.2deg}to{opacity:1;translate:0 0;rotate:0}}
@media(prefers-reduced-motion:reduce){.shp-postit-wrap{animation:none}.shp-postit{transition:none}}



/* ===== Fases: cada uma muda o clima do fundo, e o chefe se adapta à cor da fase ===== */
body{transition:background-color .9s ease}
body.wd1{--bg:#081318;--bc:#c77dff}
body.wd1.boss{background:#160a1f}
body.wd2{--bg:#14100b;--bc:#5fb0ff}
body.wd2.boss{background:#091221}
:root[data-theme=l] body.wd1{--bg:#e0edec;--bc:#8a3fd0}
:root[data-theme=l] body.wd1.boss{background:#ebdff5}
:root[data-theme=l] body.wd2{--bg:#f2e9d4;--bc:#1f6fc0}
:root[data-theme=l] body.wd2.boss{background:#dae7f6}
.wnext{display:inline-flex;align-items:center;gap:8px;font:700 9px 'Chivo Mono',ui-monospace,monospace;letter-spacing:.22em;color:var(--mu)}
.wnext i{width:9px;height:9px;border-radius:50%;background:var(--wc,var(--mx));box-shadow:0 0 12px var(--wc,var(--mx))}
.devtag{font:700 9px 'Chivo Mono',ui-monospace,monospace;letter-spacing:.3em;color:var(--mo)}
.devrow{flex:none;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;width:100%;padding:6px 8px;border:1px dashed color-mix(in srgb,var(--mo) 55%,var(--ln));border-radius:4px;font:600 9px 'Chivo Mono',ui-monospace,monospace;color:var(--mo)}
.devrow i{font-style:normal;font-weight:700;letter-spacing:.24em}
.devrow button{font:inherit;letter-spacing:.06em;color:var(--tx);background:color-mix(in srgb,var(--mo) 10%,transparent);border:1px solid color-mix(in srgb,var(--mo) 40%,var(--ln));border-radius:3px;padding:6px 9px;cursor:pointer}
#app:has(.handw)>.devrow{grid-column:1/-1}

/* =====================================================================
   v2 — recursos com cor própria, tally em Alfa Slab, poderes compactos
   e mão em uma linha (cabe qualquer tamanho de mão)
   ===================================================================== */
:root{--c-jog:#5bbcff;--c-tro:#5ee0a0;--c-mao:#b794f6;--coin:#ffd84a}
:root[data-theme=l]{--c-jog:#1b72c2;--c-tro:#12905a;--c-mao:#7a4fd6;--coin:#b07d00}

/* ---- barra de recursos: cada recurso tem a sua cor ---- */
.sj{--sc:var(--c-jog)}.sd{--sc:var(--c-tro)}.st.g{--sc:var(--coin)}
.st.g{color:var(--coin)}
.sv .n{color:var(--sc,var(--tx))}
.sv{display:inline-flex;align-items:baseline;justify-content:center;gap:5px}
.sv .n{display:inline-block;font-weight:inherit;transform-origin:50% 70%}
.sv .n.up{animation:stUp .62s cubic-bezier(.2,.9,.25,1.2) both}
.sv .n.dn{animation:stDn .5s ease-out both}
.sv em{font:700 8px/1 'Chivo Mono',ui-monospace,monospace;font-style:normal;letter-spacing:.02em;padding:2px 4px;border-radius:99px;color:var(--sc);background:color-mix(in srgb,var(--sc) 18%,transparent);border:1px solid color-mix(in srgb,var(--sc) 38%,transparent);transform:translateY(-3px)}
.st.low .sv .n{color:var(--ca)}
.st.zero{opacity:.5}
@keyframes stUp{0%{scale:1}28%{scale:1.55;translate:0 -3px;filter:brightness(1.5);text-shadow:0 0 12px var(--sc),0 0 26px var(--sc)}100%{scale:1;filter:none;text-shadow:none}}
@keyframes stDn{0%{scale:1;opacity:1}30%{scale:.72;opacity:.5}100%{scale:1;opacity:1}}
@keyframes lowP{from{opacity:.35}to{opacity:1}}

/* dinheiro agora é amarelo em todo o jogo */
.gain,.ptag,.shp-pay b,.shp-sell b{color:var(--coin)}
.ptag{border-color:color-mix(in srgb,var(--coin) 45%,transparent)}

/* extras que aumentam jogadas, trocas, mão e moedas ganham a cor do recurso */
.rs[data-p=jog]{--rk:var(--c-jog)}.rs[data-p=desc]{--rk:var(--c-tro)}.rs[data-p=hand]{--rk:var(--c-mao)}.rs[data-p=cx]{--rk:var(--coin)}
.rs .rk{display:none}
.rs.on[data-p] .rk{display:block;position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--rk);box-shadow:0 0 0 1.5px rgba(0,0,0,.35),0 0 9px var(--rk);z-index:3}
.hchip{display:inline-block;margin-right:9px;padding:2px 7px;border-radius:99px;border:1px solid color-mix(in srgb,var(--c-mao) 45%,transparent);background:color-mix(in srgb,var(--c-mao) 16%,transparent);color:var(--c-mao);font:700 8px/1.3 'Chivo Mono',ui-monospace,monospace;letter-spacing:.14em}

/* ---- contagem de cada carta/poder: mesmo estilo de antes, só com a fonte do jogo ---- */
.ft.tally{font-family:'Alfa Slab One',Georgia,serif;font-weight:400}

.btn.off{opacity:.35}

/* ---- mão em uma linha: se a mão cresce (Mão Maior, Luva…), as cartas encolhem em vez de quebrar a linha ---- */
@media(max-width:759px){
  .hand{flex-wrap:nowrap;--hn:8;
    --tw:min(calc((min(100vw,480px) - 60px)/8),calc((min(100vw,480px) - 22px - (var(--hn) - 1)*4px)/var(--hn)));
    --th:calc(var(--tw)*1.3)}
  .handw{min-height:calc(var(--th) + 12px)}

  /* ---- poderes compactos: 8 vagas em 2 linhas finas (letra + nome), mesma identidade de raridade ---- */
  #app>.rel{gap:5px}
  #app>.rel[style*="--rc:5"]{grid-template-columns:repeat(3,minmax(0,1fr))}
  #app>.rel .rs{--rh:35px;max-width:none;width:100%;border-radius:6px}
  #app>.rel .rs:not(.on){opacity:.55}
  #app>.rel .rs.on{flex-direction:row;align-items:center;gap:5px;padding:3px 5px 3px 3px;text-align:left}
  #app>.rel .rs.on::before{inset:2px;border-radius:4px}
  #app>.rel .rs.on .art{flex:none;width:27px;height:27px;min-height:0;--af:19px;border-radius:4px;background:color-mix(in srgb,var(--ink) 13%,transparent)}
  #app>.rel .rs.on .art b{transform:translateY(2%) scale(1)}
  #app>.rel .rs.on small{flex:1;min-width:0;height:auto;max-height:2.35em;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;justify-content:flex-start;text-align:left;font-size:7.5px;line-height:1.17;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word}
  #app>.rel .rs.on[data-p] .art{background:var(--rk);color:#16120a;box-shadow:0 0 10px color-mix(in srgb,var(--rk) 55%,transparent)}
  #app>.rel .rs.on[data-p] .rk{display:none}
}
@media(max-width:380px){
  #app>.rel .rs.on .art{width:23px;height:23px;--af:16px}
  #app>.rel .rs.on small{font-size:7px}
}
@media(max-width:759px) and (max-height:700px){#app>.rel .rs{--rh:32px}}

/* =====================================================================
   CAIXA ALTA — experiência desktop
   Mantém a linguagem visual original; reorganiza a hierarquia para mouse,
   teclado e telas largas, sem ampliar os elementos como se fossem mobile.
   ===================================================================== */
@media (min-width:760px){
  html,body{min-height:100%;overflow-x:hidden;overflow-y:auto}
  #app{width:min(1380px,calc(100% - 36px));min-height:100dvh;height:auto;margin:0 auto;padding:26px clamp(22px,3.4vw,50px) 42px;gap:16px;overflow:visible}

  /* Título: marca à esquerda, escolha de baralho e início à direita. */
  #app:has(.title-screen){max-width:1240px;justify-content:center}
  .title-screen{display:grid;grid-template-columns:minmax(330px,.92fr) minmax(420px,1.08fr);grid-template-areas:"hero label" "hero decks" "tagline decks" "record action";grid-template-rows:auto auto auto auto;align-items:center;column-gap:clamp(28px,4.5vw,66px);row-gap:14px;text-align:left;width:100%;max-width:1040px;min-height:540px;margin:0 auto;padding:28px 0 40px}
  .title-screen>.logo{grid-area:hero;justify-self:center;align-self:end}
  .title-screen>.sub{grid-area:tagline;justify-self:center;align-self:start;text-align:center}
  .title-screen>.lbl{grid-area:label;align-self:end;margin:0 0 2px}
  .title-screen>.dk{grid-area:decks;grid-template-columns:repeat(2,minmax(0,1fr));align-self:stretch;align-content:start}
  .title-screen>.big{grid-area:action;justify-self:end;align-self:start}
  .title-screen>.title-record{grid-area:record;justify-self:center;align-self:center}
  .title-screen>.devtag{grid-column:1;grid-row:4;justify-self:center;align-self:end}
  .title-screen .logo{--tw:clamp(58px,6.2vw,76px);--th:calc(var(--tw)*1.3);gap:7px;margin:14px 0 2px}
  .title-screen .logo .tl{width:var(--tw);height:var(--th);font-size:calc(var(--tw)*.64)}
  .title-screen .sub{font-size:9px;letter-spacing:.34em;margin-bottom:10px}
  .title-screen .dk{gap:9px}
  .title-screen .dkc{min-height:76px;padding:12px 14px;border-radius:4px}
  .title-screen .dkc b{font-size:15px}
  .title-screen .dkc small{font-size:9px;line-height:1.45}
  .title-screen .big{width:min(100%,340px);min-height:54px;margin-top:8px;font-size:12px;transition:transform .14s,filter .14s,box-shadow .14s}
  .title-screen .big:hover{filter:brightness(1.08);transform:translateY(-2px);box-shadow:0 5px 0 color-mix(in srgb,var(--tx) 55%,var(--bg))}
  .title-screen .title-record{font-size:9px;text-align:left;line-height:1.6}
  .title-screen .lbl{font-size:9px}
  .title-screen .coop-help{width:25px;height:25px}

  /* Tela de partida: os elementos de estado permanecem no topo; mesa e mão
     passam a ocupar colunas de leitura distintas. */
  #app:has(.handw){display:grid;grid-template-columns:minmax(0,1.04fr) minmax(400px,.96fr);align-content:start;align-items:stretch;column-gap:clamp(20px,2.5vw,36px);row-gap:14px}
  #app:has(.handw)>.hdr,
  #app:has(.handw)>.stats,
  #app:has(.handw)>.key,
  #app:has(.handw)>.bossb,
  #app:has(.handw)>.rel,
  #app:has(.handw)>.devrow{grid-column:1/-1}
  #app:has(.handw)>.hdr{align-items:center;padding:2px 2px 8px;border-bottom:1px solid var(--ln)}
  #app:has(.handw)>.ed{font-size:42px}
  #app:has(.handw)>.stats{grid-template-columns:repeat(3,minmax(0,1fr));max-width:880px;width:100%;justify-self:center}
  #app:has(.handw)>.stats .st{font-size:21px;padding:12px 8px}
  #app:has(.handw)>.stats .st small{font-size:9px}
  #app:has(.handw)>.key{padding:12px 14px 16px;max-width:980px;width:100%;justify-self:center}
  #app:has(.handw)>.key b{font-size:clamp(38px,4vw,58px);margin:3px 0 8px}
  #app:has(.handw)>.key small.key-prize{font-size:13px}
  #app:has(.handw)>.rel{display:grid;grid-template-columns:repeat(var(--rc,4),minmax(84px,112px));justify-content:center;gap:10px 12px;padding:2px 0 4px}
  #app:has(.handw)>.rel .rs{--rh:92px;max-width:112px;width:100%;border-radius:7px}
  #app:has(.handw)>.rel .rs .art{--af:36px}
  #app:has(.handw)>.board{grid-column:1;align-self:center;justify-self:stretch;width:100%;min-width:0;min-height:320px;gap:14px;padding:clamp(16px,2vw,24px);border:1px solid var(--ln);border-radius:7px;background:linear-gradient(145deg,color-mix(in srgb,var(--tx) 3%,var(--bg)),color-mix(in srgb,var(--bg) 96%,#000));box-shadow:0 12px 32px #00000012}
  #app:has(.handw)>.board .pill{font-size:12px;min-height:18px}
  #app:has(.handw)>.board .tray{width:max-content;max-width:100%;grid-template-columns:repeat(8,var(--tw));gap:clamp(5px,.65vw,9px);padding:10px;background:color-mix(in srgb,var(--bg) 60%,transparent)}
  #app:has(.handw)>.board .slot{width:var(--tw);height:var(--th)}
  #app:has(.handw)>.board .eq{gap:clamp(20px,2.7vw,38px);margin-top:3px}
  #app:has(.handw)>.board .pt{min-width:112px}
  #app:has(.handw)>.board .pt b{font-size:clamp(31px,2.8vw,40px)}
  #app:has(.handw)>.board .tot{min-height:36px;font-size:32px}
  #app:has(.handw)>.handw{--tw:clamp(38px,3.55vw,52px);--th:calc(var(--tw)*1.3);grid-column:2;align-self:stretch;justify-content:center;gap:20px;min-width:0;min-height:320px;padding:clamp(18px,2vw,30px);border:1px solid var(--ln);border-radius:7px;background:linear-gradient(155deg,color-mix(in srgb,var(--tx) 4%,var(--bg)),color-mix(in srgb,var(--bg) 95%,#000));box-shadow:0 12px 32px #00000012}
  #app:has(.handw)>.handw .hand{--tw:inherit;--th:inherit;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:14px 8px;max-width:100%}
  #app:has(.handw)>.handw .hand .tl{width:var(--tw);height:var(--th);flex:0 0 var(--tw);font-size:calc(var(--tw)*.64)}
  #app:has(.handw)>.handw .deckn{font-size:10px;letter-spacing:.14em;text-align:center}
  #app:has(.handw)>.btns{grid-column:1;grid-template-columns:repeat(4,minmax(0,1fr));align-self:start;gap:8px}
  #app:has(.handw)>.btns .btn{height:52px;font-size:10px;letter-spacing:.08em;border-radius:4px;transition:transform .12s,filter .12s,background .12s}
  #app:has(.handw)>.btns .btn:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-2px)}
  #app:has(.handw)>.btns .btn:focus-visible,
  .title-screen .big:focus-visible,
  .title-screen .dkc:focus-visible{outline:2px solid var(--mx);outline-offset:3px}

  /* Loja: inventário e vitrine lado a lado; sem desperdiçar a largura do PC. */
  #app:has(.shop){width:min(1380px,calc(100% - 36px));max-width:1380px}
  .shop{display:grid;grid-template-columns:minmax(310px,.82fr) minmax(0,1.18fr);align-items:start;gap:14px 18px;padding:4px 0 28px}
  .shop>.hdr2,.shop>.shp-line,.shop>.shp-boss,.shop>.shp-msg,.shop>.shp-sell-notice,.shop>.devrow{grid-column:1/-1}
  .shop>.hdr2{padding:0 2px 6px}
  .shop .hdr2 h2{font-size:36px}
  .shop .hdr2 .st{font-size:23px}
  .shop>.shp-line{justify-content:space-between;padding:8px 3px;border-block:1px solid var(--ln);font-size:12px}
  .shop>.shp-panel{min-width:0;height:100%;padding:15px;border-radius:8px}
  .shop>.shp-owned{grid-column:1;grid-row:5}
  .shop>.shp-market{grid-column:2;grid-row:5;gap:12px}
  .shop .shp-head{min-height:32px;padding:0 4px 9px}
  .shop .shp-t b{font-size:11px}
  .shop .shp-t em{font-size:11px}
  .shop .shp-owned .rel{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:14px 10px}
  .shop .shp-owned .rs{--rh:102px;max-width:116px;width:100%}
  .shop .shp-owned .rs .art{--af:38px}
  .shop .shp-grid{grid-template-columns:148px minmax(0,1fr);gap:12px}
  .shop .shp-actions{gap:10px}
  .shop .shp-go,.shop .shp-roll{min-height:76px;border-radius:6px}
  .shop .shp-offers{gap:12px;padding:14px 10px}
  .shop .shp-slot{gap:8px}
  .shop .shp-slot .cd{max-width:132px}
  .shop .shp-letters{padding:12px 10px;border-radius:7px}
  .shop .shp-ups{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 8px}
  .shop .shp-up{justify-content:flex-start;padding:5px;gap:9px;border-radius:4px}
  .shop .shp-up:hover{background:color-mix(in srgb,var(--tx) 5%,transparent)}
  .shop .shp-up .tl{--tw:38px;--th:50px}
  .shop .shp-postit-wrap{margin-top:5px}
  .shop .shp-postit{min-height:72px;padding:12px 16px}
  .shop .shp-postit-copy b{font-size:12px}
  .shop .shp-postit-copy small{font-size:9px}
  .shop .shp-postit-cost{font-size:13px}

  /* Fim de fase: resumo horizontal e controles com espaço de clique confortável. */
  #app:has(.sum){width:min(980px,calc(100% - 48px));justify-content:center}

const DIC_ONLINE_CACHE=new Map();
const DIC_ONLINE_SILENT_FAILED=new Set();
const DicionarioOnline=Object.freeze({
  estado(palavra){
    const chave=normalizarPalavra(palavra);
    if(DIC.has(chave))return true;
    return DIC_ONLINE_CACHE.has(chave)?DIC_ONLINE_CACHE.get(chave):null;
  },
  async consultar(palavra){
    const chave=normalizarPalavra(palavra);
    if(DIC.has(chave))return true;
    if(DIC_ONLINE_CACHE.has(chave))return DIC_ONLINE_CACHE.get(chave);
    if(!/^[a-z]{3,8}$/.test(chave))return false;
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),7000);
    const base="https://pt.wiktionary.org/w/api.php";
    const requisitar=async params=>{
      const url=base+"?"+params.toString();
      const res=await fetch(url,{method:"GET",mode:"cors",cache:"no-store",signal:controller.signal});
      if(!res.ok)throw new Error("Falha ao consultar o dicionário");
      return res.json();
    };
    const temSecaoPortuguesa=async titulo=>{
      const params=new URLSearchParams({action:"parse",format:"json",formatversion:"2",origin:"*",redirects:"1",page:titulo,prop:"wikitext"});
      const dados=await requisitar(params);
      const bruto=dados?.parse?.wikitext;
      const texto=typeof bruto==="string"?bruto:(bruto?.["*"]||"");
      // O Wikcionário reúne idiomas diferentes na mesma página. Só vale uma entrada
      // que tenha seção própria de Português; encontrar apenas o título não basta.
      return /^(={1,2})\s*(?:\{\{\s*-?pt-?\s*\}\}|Portugu[eê]s)\s*\1\s*$/im.test(texto);
    };
    try{
      const busca=new URLSearchParams({action:"query",format:"json",formatversion:"2",origin:"*",list:"search",srsearch:chave,srnamespace:"0",srlimit:"20"});
      const dados=await requisitar(busca);
      const titulos=(dados?.query?.search||[])
        .filter(item=>normalizarPalavra(item.title)===chave)
        .map(item=>item.title);
      // Se a busca não entregar o título, tenta a grafia sem acento diretamente.
      if(!titulos.length)titulos.push(chave);
      let encontrada=false;
      for(const titulo of [...new Set(titulos)]){
        if(await temSecaoPortuguesa(titulo)){encontrada=true;break;}
      }
      DIC_ONLINE_CACHE.set(chave,encontrada);
      if(encontrada){
        DIC.add(chave);
        if(typeof DICARR!=="undefined"&&!DICARR.includes(chave))DICARR.push(chave);
      }
      return encontrada;
    }catch(e){
      // Falha de rede não é prova de que a palavra não existe.
      return null;
    }finally{clearTimeout(timer)}
  }
});

function validarPalavraEmSilencio(){
  if(!R||G.mode!=="play"||R.lock||R.dv){validacaoSilenciosaToken++;validacaoSilenciosaChave="";return}
  const ts=R.st,chave=normalizarPalavra(wd(ts));
  if(ts.length<3||!trayConsecutive()||legal(ts)){
    validacaoSilenciosaToken++;validacaoSilenciosaChave="";return;
  }
  if(DIC.has(chave)||DIC_ONLINE_CACHE.has(chave)||DIC_ONLINE_SILENT_FAILED.has(chave))return;
  if(validacaoSilenciosaChave===chave)return;
  const token=++validacaoSilenciosaToken;validacaoSilenciosaChave=chave;
  DicionarioOnline.consultar(chave).then(encontrada=>{
    if(token!==validacaoSilenciosaToken)return;
    validacaoSilenciosaChave="";
    if(encontrada===null)DIC_ONLINE_SILENT_FAILED.add(chave);
    if(!R||G.mode!=="play"||R.lock||R.dv||normalizarPalavra(wd(R.st))!==chave||R.st.length<3||!trayConsecutive())return;
    ren();
  }).catch(()=>{
    if(token===validacaoSilenciosaToken){validacaoSilenciosaChave="";DIC_ONLINE_SILENT_FAILED.add(chave)}
  });
}
