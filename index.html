.shop{width:100%;gap:0;text-align:left;padding:2px 0 18px}
.shop .hdr2{padding:2px 0 11px;border-bottom:1px solid var(--ln);align-items:center}
.shop .hdr2 h2{font-size:27px}
.shop .hdr2 .st{font-size:19px;padding:0 0 0 8px;min-width:82px;text-align:right}
.shop .hdr2 .st small{font-size:8px;margin-bottom:3px}
.shop-rewards{width:100%;display:flex;flex-direction:column;gap:6px;padding:9px 0 11px;border-bottom:1px solid var(--ln)}
.shop-kicker{font:600 8px 'Chivo Mono',monospace;letter-spacing:.22em;color:var(--mu)}
.shop .pay{justify-content:flex-start;gap:5px 13px;line-height:1.3}
.shop .pay span{border:0;border-radius:0;padding:0;font-size:10px;color:var(--mu)}
.shop .pay span b{font-weight:700;color:var(--mo);margin-left:2px}
.shop-next{width:100%;display:flex;flex-direction:column;gap:7px;padding:11px 0;border-bottom:1px solid var(--ln)}
.shop-next-main{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:11px}
.shop-next-main>span{color:var(--mu);font-size:9px;letter-spacing:.12em}
.shop-next-main>span b{font-size:14px;color:var(--tx);letter-spacing:0}
.shop-target{font-size:10px;font-weight:600;color:var(--tx);white-space:nowrap}
.shop-boss{display:flex;gap:7px;align-items:baseline;flex-wrap:wrap;font-size:10px;line-height:1.35}
.shop-boss>span:first-child{font-size:8px;color:var(--ca);letter-spacing:.14em;font-weight:700}
.shop-boss b{font-size:11px;color:var(--tx)}
.shop-boss span:last-child{color:var(--mu)}
.shop-section{width:100%;display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--ln)}
.shop-section-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;width:100%}
.shop-section-head b{font:600 9px 'Chivo Mono',monospace;letter-spacing:.18em;color:var(--tx)}
.shop-section-head small{font-size:9px;color:var(--mu);text-align:right}
.shop .leg{justify-content:flex-start;gap:10px;letter-spacing:.08em}
.shop .leg span{font-size:7.5px}
.shop .leg span::before{width:5px;height:5px;margin-right:4px}
.shop .cards{gap:6px}
.shop .cd{min-height:116px;padding:8px 5px 7px;gap:5px}
.shop .cd em{font-size:7px;letter-spacing:.13em}
.shop .cd b{font-size:12px}
.shop .cd small{font-size:9px;line-height:1.3}
.shop .cd .pr{font-size:11px}
.shop-refresh{align-self:flex-end;display:flex;align-items:center;gap:8px;border:1px solid var(--ln);border-radius:3px;background:none;color:var(--mu);padding:7px 9px;font:600 9px 'Chivo Mono',monospace;letter-spacing:.04em}

.shop .svc{gap:6px}
.shop .sv{padding:8px 7px;font-size:10px}
.shop .sv small{font-size:9px;line-height:1.3}
.shop-owned{padding-bottom:11px}
.shop-owned .rel{margin-top:1px}
.shop-owned .rs{height:38px}
.shop .sell{border-radius:3px;padding:8px;font-size:10px;line-height:1.4}
.shop .sell span{min-width:0}
.shop .sell button{white-space:nowrap;padding:7px 8px;font-size:9px}
.shop .shop-msg{margin:0;font-size:10px;line-height:1.4;color:var(--mx)}
.shop-continue{width:100%;padding-top:12px}
.shop .big{width:100%;padding:13px 12px}
.shop button{touch-action:manipulation}

 .btn{height:42px}
}

  const nextH=Math.max(1,Math.round(rect.height||document.documentElement.clientHeight||window.innerHeight));
  if(nextDPR===DPR&&nextW===W&&nextH===H&&bg.width===Math.round(W*DPR)&&bg.height===Math.round(H*DPR)&&fx.width===Math.round(W*DPR)&&fx.height===Math.round(H*DPR))return;

    const w=Math.max(1,Math.round(W*DPR)),h=Math.max(1,Math.round(H*DPR));

const tH=(t,a,i,extra,dl)=>{
  const cl="tl"+(t.g?" gd":"")+(t.r?" rb":"")+(t.k?" cr":"")+(RARAS.includes(t.l)?" ra":"")+(extra||"")+(R&&R.fresh.has(t.id)?" nw":"")+(banned(t)?" bn":"");
  return `<button class="${cl}" data-id="${t.id}" ${a}="${i}" style="--k:${i%3-1};--d:${dl||0}">${t.l}<small>${VAL[t.l]*3+5*t.g}</small></button>`;
};
function relRow(shop){
  let h='<div class="rel">';
  for(let i=0;i<RMAX;i++){const r=G.rel[i];h+=r?`<button class="rs on k${r.k}${R&&R.an&&R.an.rel===i&&G.mode==="play"?" fl":""}${shop&&G.sel===i?" sel":""}" data-r="${i}"><small>${r.n}</small></button>`:'<span class="rs"></span>'}
  return h+"</div>";
}
const muteB=()=>`<span class=</button></span>`;
function vTitle(){
  const row=(s,o)=>`<div class="lrow">${[...s].map((ch,i)=>`<span class="tl${(o+i)%4===1?" gd":(o+i)%7===3?" rb":""}" style="--i:${o+i}">${ch}</span>`).join("")}</div>`;
  return `<div class="hdr" style="justify-content:flex-end">${muteB()}</div><div class="ov"><div class="logo">${row("CAIXA",0)}${row("ALTA",5)}</div><div class="sub">FORME PALAVRAS. BATA A META.</div>
  <div class="steps"><div><i>1</i><span>Toque nas letras da sua mão para montar uma palavra.</span></div><div><i>2</i><span>Cada letra vale <strong style="color:var(--tx)">pontos</strong>. Palavras longas e poderes dão <strong style="color:var(--ca)">bônus</strong>.</span></div><div><i>3</i><span>Pontos × bônus = sua pontuação. Chegue à meta antes que as jogadas acabem.</span></div><div><i>4</i><span><strong style="color:var(--mx)">Dica:</strong> toda fase sorteia um trecho. Se sua palavra contiver esse trecho, você ganha um prêmio extra.</span></div></div>
  <div class="lbl">ESCOLHA SEU BARALHO</div>
  <div class="dk">${DECKS.map((d,i)=>`<button class="dkc${G.dk===i?" sel":""}" data-dk="${i}"><b>${d.n}</b><small>${d.d}</small></button>`).join("")}</div>
  <button class="big" data-a="start">COMEÇAR</button>
  <p style="font-size:10px;color:var(--mu)">${S.runs?`Recorde: fase ${S.best}/8 · ${S.wins} vitória(s)`+(S.bw?`<br>Melhor palavra: ${S.bw} (${fmt(S.bs)})`:""):"Sua primeira partida começa agora."}</p></div>`;
}
function vPlay(){
  const a=R.an,st=R.st,b=R.boss,w=wd(st),realWord=DicionarioLocal.tem(w),hit=w.length>=3&&realWord&&w.includes(R.sw.toUpperCase());
  const pv=!a&&st.length>=3&&!legal(st)?evalWord(st,true):null;
  const c=a?a.c:pv?pv.c:0,m=a?a.m:pv?pv.m:0,pop=a?a.pop:"";
  let pill,pc="";
  if(a){pill=a.msg;pc=a.real?"ok":"nv"}
  else if(!st.length)pill="Toque nas letras abaixo";
  else if(st.length<3)pill="Mínimo de 3 letras";
  else{const er=legal(st);if(er){pill=er;pc="er"}else if(!realWord){pill="Palavra inexistente · 0 pontos · consome uma jogada";pc="nv"}else{pill="Palavra válida"+(hit?" · trecho encaixado: prêmio extra!":"");pc="ok"}}
  const tot=a&&a.out!==null?`<div class="tot pop">= ${fmt(a.out)}</div>`:pv?`<div class="tot pv">${pv.real?"≈ "+fmt(pv.c*pv.m):"0 PONTOS"}</div>`:'<div class="tot"></div>';
  const sc=R.sc+(a&&a.out||0),pct=Math.min(100,sc/R.meta*100);
  return `<div class="hdr"><div class="ed"><small>FASE</small>${G.n+1}<i>${G.endless?"":"/8"}</i></div><div class="goal"><div class="gt"><span>${pct>=80&&sc<R.meta?"FALTA POUCO":"META"}</span><b>${fmt(sc)} / ${fmt(R.meta)}</b></div><div class="bar${b?" bs":""}${pct>=80&&sc<R.meta?" hot":""}"><i style="width:${pct}%"></i></div></div>${muteB()}</div>
  <div class="stats"><div class="st"><small>JOGADAS</small>${R.jog}</div><div class="st"><small>TROCAS</small>${R.desc}</div><div class="st g"><small>MOEDAS</small>$${G.$}</div></div>
  <div class="key${hit?" hit":""}"><small></small><b><span class="key-word">${[...R.sw.toUpperCase()].map(ch=>`<span>${ch}</span>`).join("")}</span></b><em>Prêmio: ${R.pw.d}</em></div>
  ${b?`<div class="bossb">CHEFE · ${b.n} — ${bossTxt(b)}</div>`:""}
  ${relRow(false)}
  <div class="board"><div class="pill ${pc}">${pill}</div>
   <div class="tray">${Array.from({length:8},(_,i)=>st[i]?`<div class="slot f">${tH(st[i],"data-s",i," sg"+(a&&a.tile===i?" hl"+(RARAS.includes(st[i].l)?" rr":""):"")+(!a&&i===st.length-1?" lnd":""))}</div>`:'<div class="slot"></div>').join("")}</div>
   <div class="eq"><div class="pt"><small>PONTOS</small><b class="${pop.includes("c")?"pop":""}">${fmt(c)}</b></div><span class="xx">×</span><div class="pt m" style="--hot:${Math.min(1,(m-1)/30)}"><small>BÔNUS</small><b class="${pop.includes("m")?"pop":""}">${fm(m)}</b></div></div>
   ${tot}<div class="msg">${a?"":R.msg}</div></div>
  <div class="handw"><div class="hand">${R.hand.map((t,i)=>tH(t,"data-h",i,"",i)).join("")}</div><div class="deckn">${"Eu te amo, Bia" } </div></div>
  <div class="btns"><button class="btn go${pc==="ok"&&!a?" rdy":""}" data-a="play">JOGAR</button><button class="btn dc" data-a="disc">TROCAR</button><button class="btn dk2" data-a="deck">BARALHO<b class="cnt">${R.deck.length}</b></button><button class="btn" data-a="clr">LIMPAR</button></div>${R.dv?vDeck():""}`;
}
function vShop(){
  const p=G.pay,nb=G.nb,sel=G.rel[G.sel];
  const pay=[['Fase',p.bs],['Jogadas',p.jg],['Cofrinho',p.cx],['Juros',p.int],['Chefe',p.b]].filter(q=>q[1]>0).map(q=>`<span>${q[0]} <b>+$${q[1]}</b></span>`).join('');
  return `<div class="ov shop">
  <div class="hdr2"><h2>Loja</h2><div class="st g"><small>MOEDAS</small>$${G.$}</div></div>
  ${pay?`<div class="shop-rewards"><small class="shop-kicker">GANHOS DA FASE</small><div class="pay">${pay}</div></div>`:''}
  <div class="shop-next"><div class="shop-next-main"><span>PRÓXIMA FASE <b>${G.n+1}</b></span><b class="shop-target">META ${fmt(metaOf(G.n))}</b></div>${nb?`<div class="shop-boss"><span>CHEFE</span><b>${nb.n}</b><span>${nb.d}</span></div>`:''}</div>
  <section class="shop-section">
    <div class="shop-section-head"><b>PODERES</b><small>Toque para comprar</small></div>
    ${leg()}
    <div class="cards">${[0,1,2].map(i=>{const r=G.off[i];return r?`<button class="cd k${r.k} r${r.r}" data-o="${i}" ${G.$<r.c||G.rel.length>=RMAX?'disabled':''}><em>${KL[r.k]} · ${['COMUM','RARO','ÉPICO'][r.r]}</em><b>${r.n}</b><small>${r.d}</small><span class="pr">$${r.c}</span></button>`:'<div class="cd empty"></div>'}).join('')}</div>
    <button class="shop-refresh" data-a="rr" ${G.$<2+G.rr?'disabled':''}>TROCAR VITRINE <b>$${2+G.rr}</b></button>
  </section>
  <section class="shop-section">
    <div class="shop-section-head"><b>MELHORIAS DE LETRAS</b><small>Letra aleatória</small></div>
    <div class="svc"><button class="sv kc" data-a="sg" ${G.$<3?'disabled':''}>Brilhante<small>+5 pontos · $3</small></button><button class="sv km" data-a="sr" ${G.$<4?'disabled':''}>Vermelha<small>+3 bônus · $4</small></button><button class="sv kx" data-a="sk" ${G.$<5?'disabled':''}>Dourada<small>×1,25 bônus · $5</small></button></div>
  </section>
  <section class="shop-section shop-owned">
    <div class="shop-section-head"><b>SEUS PODERES</b><small>${G.rel.length}/${RMAX} · toque para vender</small></div>
    ${relRow(true)}
    ${sel?`<div class="sell"><span><b>${sel.n}</b> — ${sel.d}</span><button data-a="sell">VENDER $${Math.floor(sel.c/2)}</button></div>`:''}
  </section>
  ${G.msg?`<p class="shop-msg">${G.msg}</p>`:''}
  <div class="shop-continue"><button class="big" data-a="next">COMEÇAR FASE ${G.n+1}</button></div>
  </div>`;
}
function vOver(){
  const s=G.stat,ed=G.n+(G.win?1:0);
  return `<div class="ov">${G.win?'<h1>Você venceu!</h1><p>Oito fases concluídas.</p>':`<h1 class="lose">Fim de jogo</h1><p>Você caiu na fase ${G.n+1} (${fmt(R.sc)} / ${fmt(R.meta)})${R.boss?" diante de "+R.boss.n:""}.</p>`}
  <div class="sum"><div>Fases vencidas<b>${ed}</b></div><div>Palavras jogadas<b>${s.words}</b></div><div>Letras usadas<b>${s.neo}</b></div><div>Melhor palavra<b>${s.bw||"—"} ${s.bs?fmt(s.bs):""}</b></div></div>
  ${relRow(false).replace(/data-r/g,"data-x")}
  <button class="big" data-a="again">JOGAR DE NOVO</button>
  ${G.win?'<button class="big alt" data-a="endless">CONTINUAR SEM LIMITE</button>':""}
  <button class="big alt" data-a="title">ESCOLHER OUTRO BARALHO</button></div>`;
}
function vDeck(){
  const cnt={};G.col.forEach(t=>{cnt[t.l]=cnt[t.l]||{n:0,g:0,r:0,k:0}});
  R.deck.forEach(t=>{const o=cnt[t.l];o.n++;if(t.g)o.g++;if(t.r)o.r++;if(t.k)o.k++});
  const L=Object.keys(cnt).sort(),tot=R.deck.length,vg=R.deck.filter(t=>VOG.includes(t.l)).length;
  return `<div class="dvw" data-a="dvx"><div class="dvh"><div><small>SEU BARALHO</small><b>${tot}</b>letras para comprar</div><button class="mute" data-a="dvx">FECHAR</button></div>
  <div class="dvs"><span>${vg} vogais</span><span>${tot-vg} consoantes</span><span>${R.hand.length+R.st.length} na mão</span></div>
  <div class="dvg">${L.map((l,i)=>{const o=cnt[l],st=Math.min(3,Math.ceil(o.n/2));return `<div class="cdk s${st}${o.n?"":" z"}${RARAS.includes(l)?" ra":""}" style="--i:${i};--a:${((i*37)%9-4)*.7}deg"><i>${l}</i><b>${l}</b><i class="b">${l}</i><span class="n">×${o.n}</span><span class="u">${o.g?'<em class="dg"></em>':""}${o.r?'<em class="dr"></em>':""}${o.k?'<em class="dx"></em>':""}</span></div>`}).join("")}</div>
  <p class="dvf">Cada pilha mostra quantas cópias da letra ainda vão ser compradas. Letras roxas são raras e valem muito. Bolinhas marcam letras melhoradas.</p></div>`;
}
function view(){return G.mode==="title"?vTitle():G.mode==="shop"?vShop():G.mode==="over"?vOver():vPlay()}
function ren(){
  const A=$("#app"),old={};
  A.querySelectorAll("[data-id]").forEach(e=>{old[e.dataset.id]=e.getBoundingClientRect()});
  A.innerHTML=view();
  document.body.classList.toggle("boss",G.mode==="play"&&!!R&&!!R.boss);
  A.querySelectorAll("[data-id]").forEach(e=>{const o=old[e.dataset.id];if(!o)return;const n=e.getBoundingClientRect(),dx=o.left-n.left,dy=o.top-n.top;if(!dx&&!dy)return;
    e.style.transition="none";e.style.translate=dx+"px "+dy+"px";void e.offsetWidth;e.style.transition="translate .3s cubic-bezier(.2,.8,.2,1.08)";e.style.translate="0 0"});
  if(R)R.fresh.clear();
}

/* ---------- arrastar e reordenar letras na própria mão ---------- */
let handDrag=null,suppressHandClick=false,suppressHandClickTimer=null;
function handDropTarget(d,x,y){
  const els=[...d.hand.querySelectorAll(':scope > [data-h]')].filter(el=>el!==d.el);
  if(!els.length){d.hand.appendChild(d.placeholder);return}
  const rows=[];
  for(const el of els){
    const r=el.getBoundingClientRect();
    let row=rows.find(q=>Math.abs(q.top-r.top)<Math.max(8,r.height*.35));
    if(!row){row={top:r.top,bottom:r.bottom,els:[]};rows.push(row)}
    row.top=Math.min(row.top,r.top);row.bottom=Math.max(row.bottom,r.bottom);row.els.push({el,r});
  }
  rows.sort((a,b)=>a.top-b.top);
  let row=rows[0],dist=Infinity;
  for(const q of rows){const dd=y<q.top?q.top-y:y>q.bottom?y-q.bottom:0;if(dd<dist){dist=dd;row=q}}
  row.els.sort((a,b)=>a.r.left-b.r.left);
  const first=row.els[0],last=row.els[row.els.length-1];
  if(x<first.r.left+first.r.width/2)d.hand.insertBefore(d.placeholder,first.el);
  else{
    const next=row.els.find(q=>x<q.r.left+q.r.width/2);
    if(next)d.hand.insertBefore(d.placeholder,next.el);
    else last.el.after(d.placeholder);
  }
}
function beginHandDrag(d,e){
  const r=d.el.getBoundingClientRect();
  d.moved=true;
  d.placeholder=document.createElement('div');
  d.placeholder.className='hand-placeholder';
  d.placeholder.dataset.dragPlaceholder='';
  d.placeholder.style.width=r.width+'px';
  d.placeholder.style.height=r.height+'px';
  d.el.before(d.placeholder);
  d.el.classList.add('dragging-hand-tile');
  Object.assign(d.el.style,{left:(e.clientX-d.offsetX)+'px',top:(e.clientY-d.offsetY)+'px',width:r.width+'px',height:r.height+'px',margin:'0'});
  try{d.el.setPointerCapture(e.pointerId)}catch(_){ }
}
function moveHandDrag(e){
  const d=handDrag;if(!d||e.pointerId!==d.pointerId)return;
  const dx=e.clientX-d.startX,dy=e.clientY-d.startY;
  if(!d.moved){if(Math.hypot(dx,dy)<7)return;beginHandDrag(d,e)}
  e.preventDefault();
  d.el.style.left=(e.clientX-d.offsetX)+'px';
  d.el.style.top=(e.clientY-d.offsetY)+'px';
  handDropTarget(d,e.clientX,e.clientY);
}
function finishHandDrag(e,cancelled=false){
  const d=handDrag;if(!d||(e&&e.pointerId!==d.pointerId))return;
  handDrag=null;
  if(d.moved&&!cancelled){
    const byId=new Map(R.hand.map(t=>[String(t.id),t]));
    const ids=[...d.hand.children].filter(el=>el===d.placeholder||(el.matches('[data-h]')&&el!==d.el)).map(el=>el===d.placeholder?String(d.id):String(el.dataset.id));
    const reordered=ids.map(id=>byId.get(id)).filter(Boolean);
    if(reordered.length===R.hand.length){R.hand=reordered;R.hand.forEach((t,i)=>t.o=i)}
    suppressHandClick=true;
    clearTimeout(suppressHandClickTimer);
    suppressHandClickTimer=setTimeout(()=>{suppressHandClick=false},180);
    ren();
  }else if(d.moved){ren()}
  else if(d.el.isConnected){d.el.classList.remove('dragging-hand-tile');d.el.style.position='';d.el.style.left='';d.el.style.top='';d.el.style.width='';d.el.style.height='';d.el.style.margin='';d.el.style.zIndex='';d.el.style.pointerEvents='';}
}
document.addEventListener('pointerdown',e=>{
  const el=e.target.closest('.hand [data-h]');
  if(!el||!e.isPrimary||(e.button!==undefined&&e.button!==0)||G.mode!=='play'||!R||R.lock||R.dv)return;
  const hand=el.closest('.hand'),r=el.getBoundingClientRect();
  handDrag={el,hand,id:el.dataset.id,pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,offsetX:e.clientX-r.left,offsetY:e.clientY-r.top,moved:false,placeholder:null};
},true);
document.addEventListener('pointermove',moveHandDrag,{passive:false});
document.addEventListener('pointerup',e=>finishHandDrag(e,false),true);
document.addEventListener('pointercancel',e=>finishHandDrag(e,true),true);

/* ---------- entrada ---------- */
document.addEventListener("click",e=>{
  if(suppressHandClick){e.preventDefault();e.stopPropagation();suppressHandClick=false;clearTimeout(suppressHandClickTimer);return}
  const t=e.target.closest("[data-h],[data-s],[data-a],[data-dk],[data-o],[data-r]");if(!t)return;au();
  const D=t.dataset;
  if(D.a==="theme"){S.theme=S.theme?0:1;save();applyTheme();sTec();ren();return}
  if(D.a==="mute"){S.mute=S.mute?0:1;save();ren();return}
  if(G.mode==="title"){
    if(D.dk!==undefined){G.dk=+D.dk;sTec();ren()}else if(D.a==="start")novo();return;
  }
  if(G.mode==="over"){
    if(D.a==="again")novo();else if(D.a==="title"){G.mode="title";ren()}
    else if(D.a==="endless"){G.endless=true;G.n++;G.nb=bossAt(G.n);G.mode="shop";G.rr=0;G.sel=-1;G.msg="";oferta();sOk();ren()}return;
  }
  if(G.mode==="shop"){
    if(D.o!==undefined)compra(+D.o);
    else if(D.r!==undefined){G.sel=G.sel===+D.r?-1:+D.r;sTec();ren()}
    else if(D.a==="sg")carimbo("g");else if(D.a==="sr")carimbo("r");else if(D.a==="sk")carimbo("k");
    else if(D.a==="rr")reimprimir();else if(D.a==="sell")vender();
    else if(D.a==="next"){G.msg="";sOk();rodada()}return;
  }
  if(R.lock){R.fast=true;return}
  if(D.h!==undefined)stage(+D.h);else if(D.s!==undefined)unstage(+D.s);
  else if(D.r!==undefined){const r=G.rel[+D.r];if(r){R.msg=r.n+" — "+r.d;sTec();ren()}}
  else if(D.a==="play")jogar();else if(D.a==="disc")descartar();else if(D.a==="deck"){R.dv=1;sTec();ren()}else if(D.a==="dvx"){R.dv=0;sTec();ren()}else if(D.a==="clr")limpar();
});
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(G.mode==="title"){if(e.key==="Enter")novo();return}
  if(G.mode==="over"){if(e.key==="Enter")novo();return}
  if(G.mode!=="play"||!R)return;
  if(R.dv){if(e.key==="Escape"||e.key==="Enter"){R.dv=0;ren()}return}
  if(R.lock){R.fast=true;return}
  const k=e.key;
  if(/^[a-zA-Z]$/.test(k)){const i=R.hand.findIndex(t=>t.l===k.toUpperCase());if(i>=0)stage(i);else sErr()}
  else if(k==="Enter"){e.preventDefault();jogar()}
  else if(k==="Backspace"){e.preventDefault();if(R.st.length)unstage(R.st.length-1)}
});
applyTheme();ren();
</script>
