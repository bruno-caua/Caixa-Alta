function coopSwapTileData(t,el=null){
  const r=el&&el.getBoundingClientRect?el.getBoundingClientRect():null;
  const vw=Math.max(1,window.innerWidth||1),vh=Math.max(1,window.innerHeight||1);
  return {id:String(t.id),l:String(t.l||"?"),g:Number(t.g)||0,r:Number(t.r)||0,k:Number(t.k)||0,skin:String(t.skin||""),up:{...(t.up||{})},
    v:tilePoints(t),
    x:r?(r.left+r.width/2)/vw:.5,y:r?(r.top+r.height/2)/vh:.5,
    w:r?r.width/vw:0,h:r?r.height/vh:0};
}
function coopSwapFindTile(id,area="app"){
  const root=area==="hand"?document.querySelector(".hand"):document.querySelector("#app");
  if(!root)return null;
  return [...root.querySelectorAll("[data-id]")].find(e=>String(e.dataset.id)===String(id))||null;
}
function coopSwapRect(data,source){
  if(source&&source.getBoundingClientRect){
    const r=source.getBoundingClientRect();if(r.width&&r.height)return {left:r.left,top:r.top,width:r.width,height:r.height};
  }
  const vw=Math.max(1,window.innerWidth||1),vh=Math.max(1,window.innerHeight||1);
  const cssW=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--tw"))||Math.min(48,(vw-60)/8);
  const cssH=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--th"))||cssW*1.3;
  const width=Math.max(1,(Number(data.w)||0)*vw||cssW),height=Math.max(1,(Number(data.h)||0)*vh||cssH);
  return {left:(Number(data.x)||.5)*vw-width/2,top:(Number(data.y)||.5)*vh-height/2,width,height};
}
function coopSwapGhost(tile,rect){
  const e=document.createElement("div");
  e.className="tl coop-swap-ghost "+tileStyleClass(tile);
  e.dataset.coopSwapGhost="1";e.textContent=String(tile.l||"?");
  const sm=document.createElement("small");sm.textContent=String(tile.v??(VAL[tile.l]*3+5*(Number(tile.g)||0)));e.appendChild(sm);
  e.style.left=rect.left+"px";e.style.top=rect.top+"px";e.style.width=rect.width+"px";e.style.height=rect.height+"px";
  e.style.animation="none";e.style.transition="none";e.style.transformOrigin="center center";return e;
}
function coopPlayDiscardVisual(data,attempt=0){
  if(!data||typeof data!=="object")return;
  const oldTiles=Array.isArray(data.old)?data.old.slice(0,8):[];
  const newTiles=Array.isArray(data.new)?data.new.slice(0,12):[];
  /* Primeiro, as letras que saem da mesa voam para fora em vez de simplesmente sumir. */
  if(attempt===0){
    oldTiles.forEach((tile,i)=>{
      const source=coopSwapFindTile(tile.id);
      const rect=coopSwapRect(tile,source);
      if(source){
        const previous=source.style.visibility;source.style.visibility="hidden";
        setTimeout(()=>{if(source.isConnected)source.style.visibility=previous},700);
      }
      const ghost=coopSwapGhost(tile,rect);document.body.appendChild(ghost);
      requestAnimationFrame(()=>{
        const anim=ghost.animate([
          {opacity:1,transform:"translateY(0) rotate(0deg) scale(1)"},
          {opacity:0,transform:`translateY(-${Math.max(50,rect.height*.9)}px) rotate(${i%2?16:-16}deg) scale(.64)`}
        ],{duration:390,delay:i*24,easing:"cubic-bezier(.2,.75,.25,1)",fill:"forwards"});
        anim.onfinish=()=>ghost.remove();
      });
    });
  }
  if(!newTiles.length)return;
  /* Os novos IDs só existem na mão depois da snapshot. Esperamos esse estado sem perder o efeito. */
  const ready=newTiles.map(tile=>({tile,target:coopSwapFindTile(tile.id,"hand")})).filter(x=>x.target);
  if(ready.length<newTiles.length&&attempt<70){setTimeout(()=>coopPlayDiscardVisual({old:[],new:newTiles},attempt+1),20);return}
  if(!ready.length)return;
  const deckButton=document.querySelector(".btn.dk2"),deckRect=deckButton&&deckButton.getBoundingClientRect();
  const tray=document.querySelector(".tray"),trayRect=tray&&tray.getBoundingClientRect();
  const startX=deckRect?deckRect.left+deckRect.width/2:trayRect?trayRect.left+trayRect.width/2:(window.innerWidth||1)/2;
  const startY=deckRect?deckRect.top+deckRect.height/2:trayRect?trayRect.top+trayRect.height/2:(window.innerHeight||1)*.55;
  ready.forEach(({tile,target},i)=>{
    const id=String(tile.id);if(COOP.swapHiddenIds.has(id))return;
    const to=target.getBoundingClientRect();if(!to.width||!to.height)return;
    COOP.swapHiddenIds.add(id);target.classList.remove("nw");target.classList.add("coop-swap-hidden");
    const from={left:startX-to.width/2,top:startY-to.height/2,width:to.width,height:to.height};
    const ghost=coopSwapGhost(tile,from);document.body.appendChild(ghost);
    requestAnimationFrame(()=>{
      const anim=ghost.animate([
        {left:from.left+"px",top:from.top+"px",opacity:0,transform:"scale(.28) rotate(18deg)"},
        {left:to.left+"px",top:to.top+"px",opacity:1,transform:"scale(1) rotate(0deg)"}
      ],{duration:520,delay:i*48,easing:"cubic-bezier(.18,.8,.22,1)",fill:"forwards"});
      const reveal=()=>{
        ghost.remove();COOP.swapHiddenIds.delete(id);
        const current=coopSwapFindTile(id,"hand");if(current)current.classList.remove("coop-swap-hidden");
      };
      anim.onfinish=reveal;setTimeout(reveal,1500);
    });
  });
}

function coopMakeSnapshot(){
  const g={...G,rel:(G.rel||[]).map(r=>r&&r.id).filter(Boolean)};
  if(Array.isArray(G.off))g.off=G.off.map(r=>r&&r.id).filter(Boolean);
  /* R.fresh e os efeitos da loja são zerados pelo ren() do P1 antes do envio (que é levemente adiado).
     Aqui eles são acumulados e entregues junto com o estado, para o P2 também ver as cartas
     entrando na mão e as animações da loja. */
  const landIds=[...(COOP.landAcc||[])];if(COOP.landAcc)COOP.landAcc.clear();
  const r=R?{...R,pw:R.pw&&R.pw.n,fresh:[...new Set([...(R.fresh||[]),...(COOP.freshAcc||[])])],landIds}:null;
  const fx=COOP.shopFx||null;COOP.shopFx=null;COOP.freshAcc=null;
  // A abertura do baralho e as pilhas expandidas são preferências locais de cada tela.
  // Nunca envie R.dv/R.dx: o P1 não deve abrir o baralho do P2 nem o contrário.
  if(r){delete r.dv;delete r.dx}
  return {type:"state",protocol:COOP_PROTOCOL,build:BUILD,from:"host",rev:++COOP.rev,tid:TID,g,r,fx};
}
function coopSendSnapshot(force=false){
  if(COOP.role!=="host"||!COOP.connected||!COOP.conn||!COOP.conn.open)return;
  clearTimeout(COOP.syncTimer);COOP.syncTimer=0;
  if(typeof handDrag!=="undefined"&&handDrag&&handDrag.moved)return
  if(!force){COOP.syncTimer=setTimeout(()=>coopSendSnapshot(true),16);return}
  const snap=coopMakeSnapshot();try{COOP.conn.send(snap)}catch(_){COOP.status="lost";COOP.connected=false;coopUpdateStatus()}
}
function coopApplySnapshot(msg){
  if(!msg||!msg.g||msg.rev<=COOP.lastRev)return;
  // Preserve apenas a visualização local do baralho durante snapshots do estado comum.
  const localDeckOpen=G.mode==="play"&&!!(R&&R.dv);
  const localDeckExpanded=localDeckOpen?{...(R.dx||{})}:{};
  COOP.applyingSnapshot=true;
  try{
    const g={...msg.g};if(Array.isArray(g.col))g.col.forEach(t=>{if(t&&!t.up)t.up={};if(t&&!t.skin)t.skin=""});g.rel=(msg.g.rel||[]).map(id=>REL.find(r=>r.id===id)).filter(Boolean);
    if(Array.isArray(msg.g.off))g.off=msg.g.off.map(id=>REL.find(r=>r.id===id)).filter(Boolean);
    G=g;
    if(msg.fx&&typeof msg.fx==="object"){G.offAnim=msg.fx.an?1:0;G.popRel=Number.isInteger(msg.fx.pop)?msg.fx.pop:-1;G.nope=String(msg.fx.nope||"");G.popUp=String(msg.fx.pu||"")}
    if(msg.r){const r={...msg.r};for(const a of [r.hand,r.st,r.deck])if(Array.isArray(a))a.forEach(t=>{if(t&&!t.up)t.up={};if(t&&!t.skin)t.skin=""});r.pw=POW.find(p=>p.n===msg.r.pw)||POW[0];r.fresh=new Set(msg.r.fresh||[]);
      const incomingLand=Array.isArray(msg.r.landIds)?msg.r.landIds.map(String):[];
      const renderLand=incomingLand.filter(id=>{if(COOP.suppressLandIds&&COOP.suppressLandIds.has(id)){COOP.suppressLandIds.delete(id);return false}return true});
      r.landId=renderLand.length?renderLand[renderLand.length-1]:null;delete r.landIds;
      r.dv=G.mode==="play"&&localDeckOpen?1:0;
      r.dx=r.dv?localDeckExpanded:{};
      R=r;
    }else R=null;
    if(Number.isFinite(msg.tid))TID=msg.tid;
    const pending=Array.isArray(COOP.optimisticActions)?COOP.optimisticActions:[];
    const confirmed=new Set(pending.filter(a=>a.ackRev!==null&&a.ackRev!==undefined&&msg.rev>a.ackRev).map(a=>a.actionId));
    COOP.optimisticActions=pending.filter(a=>!confirmed.has(a.actionId));
    for(const action of COOP.optimisticActions)coopApplyOptimisticAction(action);
    COOP.lastRev=msg.rev;COOP.status="connected";COOP.connected=true;COOP.modalNote="";
    coopCloseModal();coopUpdateStatus();document.body.classList.toggle("boss",G.mode==="play"&&!!R&&!!R.boss);applyWorld();
    ren();
  }catch(err){console.error("Falha ao aplicar estado Coop",err);COOP.modalNote="Recebi uma atualização inválida. Tente reconectar.";coopUpdateStatus()}
  finally{COOP.applyingSnapshot=false}
}
function coopQueuePendingSnapshot(){
  setTimeout(()=>{if(handDrag||COOP.dragCommitPending)return;const snap=COOP.pendingSnapshot;if(snap){COOP.pendingSnapshot=null;coopApplySnapshot(snap)}},90)
}
function coopCheckBuild(msg){
  if(!msg||COOP.versionMismatch||msg.build===BUILD)return;
  COOP.versionMismatch=String(msg.build||"anterior");coopUpdateStatus();
}
function coopHardReload(){location.replace(location.pathname+"?v="+Date.now())}
function coopHandleHostMessage(msg){
  if(msg.from==="guest")coopCheckBuild(msg);
  if(msg.protocol!==COOP_PROTOCOL||msg.from!=="guest")return;
  if(msg.type==="hello"){coopSendSnapshot(true);coopSend({type:"chatHistory",messages:(COOP.chatMessages||[]).slice(-40)});return}
  if(msg.type==="chat"){const received=coopAppendChatMessage(msg.message,"guest");if(received)coopSend({type:"chatRelay",message:received});return}
  if(msg.type==="action"){
    if(COOP.dragLock){coopSend({type:"actionDenied",actionId:msg.actionId,reason:"Aguarde o fim do arrasto atual."});return}
    const dispatched=coopDispatchAction(msg);
    if(dispatched&&msg.optimistic&&Number.isFinite(Number(msg.actionId)))coopSend({type:"actionAck",actionId:Number(msg.actionId),rev:COOP.rev});
    return;
  }
  if(msg.type==="requestSnapshot"){coopSendSnapshot(true);return}
  if(msg.type==="dragStart"){
    if(G.mode!=="play"||!R||R.lock||R.dv){coopSend({type:"dragRejected",id:msg.id,reason:"A partida está ocupada; tente novamente."});return}
    if(COOP.dragLock||handDrag&&handDrag.moved){coopSend({type:"dragRejected",id:msg.id,reason:"Outro arrasto tem prioridade."});return}
    COOP.dragLock={owner:"guest",id:String(msg.id),mode:msg.mode};coopSend({type:"dragAccepted",id:String(msg.id)});return;
  }
  if(msg.type==="dragPreview"){
    if(!COOP.dragLock||COOP.dragLock.owner!=="guest"||String(COOP.dragLock.id)!==String(msg.id))return;
    coopShowRemoteDrag(msg);return;
  }
  if(msg.type==="dragCommit"){
    if(!COOP.dragLock||COOP.dragLock.owner!=="guest"||String(COOP.dragLock.id)!==String(msg.id)){COOP.dragLock=null;coopClearRemoteDrag(false);coopSend({type:"dragRejected",id:msg.id,reason:"A mesa mudou durante o arrasto; sincronizei a posição da carta."});coopSendSnapshot(true);return}
    coopApplyDragCommit(msg);COOP.dragLock=null;coopClearRemoteDrag(false);ren();coopSendSnapshot(true);return;
  }
  if(msg.type==="dragCancel"||msg.type==="dragEnd"){
    if(!COOP.dragLock||COOP.dragLock.owner!=="guest"||String(COOP.dragLock.id)!==String(msg.id))return;
    COOP.dragLock=null;coopClearRemoteDrag(false);ren();coopSendSnapshot(true);return;
  }
}
function coopHandleGuestMessage(msg){
  if(msg.from==="host")coopCheckBuild(msg);
  if(msg.protocol!==COOP_PROTOCOL||msg.from!=="host")return;
  if(msg.type==="room-full"){coopShowError("Esta sala já tem dois jogadores.");return}
  if(msg.type==="chat"){coopAppendChatMessage(msg.message,"host");return}
  if(msg.type==="chatRelay"){coopAppendChatMessage(msg.message);return}
  if(msg.type==="chatHistory"){if(Array.isArray(msg.messages))msg.messages.slice(-40).forEach(m=>coopAppendChatMessage(m,null,true));return}
  if(msg.type==="soundBatch"){coopPlayRemoteSoundBatch(msg.events||[]);return}
  if(msg.type==="actionAck"){
    const action=COOP.optimisticActions.find(a=>a.actionId===Number(msg.actionId));
    if(action)action.ackRev=Number.isFinite(Number(msg.rev))?Number(msg.rev):COOP.rev;
    return;
  }
  if(msg.type==="visual"){
    const seq=Number(msg.visualSeq)||0;
    if(seq){
      if(!COOP.seenVisual)COOP.seenVisual=new Set();
      if(COOP.seenVisual.has(seq))return;
      COOP.seenVisual.add(seq);
      if(COOP.seenVisual.size>600)COOP.seenVisual.delete(COOP.seenVisual.values().next().value);
      COOP.lastVisualSeq=Math.max(COOP.lastVisualSeq,seq);
    }
    coopPlayRemoteVisual(msg.visual,msg.data||{});return;
  }
  if(msg.type==="state"){
    const dragPending=COOP.dragCommitPending;
    if(handDrag||(dragPending&&!coopSnapshotConfirmsDrag(msg,dragPending))||(COOP.dragLock&&COOP.dragLock.owner==="host"&&COOP.remotePreview)){
      if(!COOP.pendingSnapshot||msg.rev>COOP.pendingSnapshot.rev)COOP.pendingSnapshot=msg;
      return;
    }
    if(dragPending&&coopSnapshotConfirmsDrag(msg,dragPending)){COOP.dragCommitPending=null;COOP.pendingSnapshot=null}
    coopApplySnapshot(msg);return;
  }
  if(msg.type==="actionDenied"){
    if(Number.isFinite(Number(msg.actionId))){COOP.optimisticActions=COOP.optimisticActions.filter(a=>a.actionId!==Number(msg.actionId));coopSend({type:"requestSnapshot"})}
    COOP.modalNote=msg.reason||"Aguarde o outro jogador.";coopUpdateStatus();return
  }
  if(msg.type==="dragAccepted")return;
  if(msg.type==="dragRejected"){
    const rejected=handDrag&&String(handDrag.id)===String(msg.id);
    if(rejected){handDrag.remoteRejected=true;finishHandDrag(null,true)}
    if(COOP.dragLock&&COOP.dragLock.owner==="guest"&&String(COOP.dragLock.id)===String(msg.id))COOP.dragLock=null;
    if(COOP.dragCommitPending&&String(COOP.dragCommitPending.id)===String(msg.id)){COOP.dragCommitPending=null;COOP.pendingSnapshot=null;coopSend({type:"requestSnapshot"})}
    coopClearRemoteDrag(false);COOP.modalNote=msg.reason||"Este arrasto foi cancelado por conflito.";coopUpdateStatus();return;
  }
  if(msg.type==="dragStart"){
    if(COOP.dragLock&&COOP.dragLock.owner==="guest"&&handDrag&&handDrag.moved){handDrag.remoteRejected=true;finishHandDrag(null,true)}
    COOP.dragLock={owner:"host",id:String(msg.id),mode:msg.mode};coopShowRemoteDrag({...msg,x:.5,y:.5,area:"screen",ox:.5,oy:.5});return;
  }
  if(msg.type==="dragPreview"){
    if(!COOP.dragLock||COOP.dragLock.owner!=="host"||String(COOP.dragLock.id)!==String(msg.id))return;
    coopShowRemoteDrag(msg);return;
  }
  if(msg.type==="dragEnd"||msg.type==="dragCancel"){
    if(COOP.dragLock&&COOP.dragLock.owner==="host"&&String(COOP.dragLock.id)===String(msg.id))COOP.dragLock=null;
    coopClearRemoteDrag(false);coopQueuePendingSnapshot();return;
  }
}
function coopDispatchAction(msg){
  if(G.mode!=="play"&&G.mode!=="shop"&&G.mode!=="over"&&G.mode!=="title")return false;
  if(COOP.dragLock){coopSend({type:"actionDenied",actionId:msg.actionId,reason:"Uma carta está sendo arrastada. Tente novamente em seguida."});return false}
  let el=null;
  if(msg.kind==="hand")el=[...document.querySelectorAll(".hand [data-h][data-id]")].find(e=>String(e.dataset.id)===String(msg.id));
  else if(msg.kind==="tray")el=[...document.querySelectorAll(".tray [data-s][data-id]")].find(e=>String(e.dataset.id)===String(msg.id));
  else if(msg.kind==="a")el=document.querySelector(`[data-a="${String(msg.value).replace(/["\\]/g,"")}"]`);
  else if(msg.kind==="dk")el=document.querySelector(`[data-dk="${Number(msg.value)}"]`);
  else if(msg.kind==="o")el=document.querySelector(`[data-o="${Number(msg.value)}"]`);
  else if(msg.kind==="postit")el=document.querySelector(`[data-postit="${String(msg.value).replace(/["\\]/g,"")}"]`);
  else if(msg.kind==="r")el=document.querySelector(`.rel [data-r="${Number(msg.value)}"]`);
  else if(msg.kind==="l")el=document.querySelector(`.dvw [data-l="${String(msg.value).replace(/["\\]/g,"")}"]`);
  if(!el){coopSend({type:"actionDenied",actionId:msg.actionId,reason:"A carta ou controle mudou. Tente novamente."});return false}
  const previousSuppress=COOP.suppressAudioRelay;
  if(msg.optimistic)COOP.suppressAudioRelay=true;
  COOP.remoteDispatch=true;try{el.click()}finally{COOP.remoteDispatch=false;COOP.suppressAudioRelay=previousSuppress}
  return true;
}
function coopApplyDragCommit(msg){
  if(!R||R.lock)return;
  const id=String(msg.id);
  if(msg.kind==="hand-to-tray"){
    const ok=placeHandTileInTray(id,Number(msg.slot));if(!ok)R.msg="Este destino não está mais disponível.";
  }else if(msg.kind==="hand-reorder"){
    const map=new Map(R.hand.map(t=>[String(t.id),t]));const ids=Array.isArray(msg.order)?msg.order.map(String):[];
    const order=ids.map(i=>map.get(i)).filter(Boolean);
    if(order.length===R.hand.length&&new Set(ids).size===R.hand.length){R.hand=order;R.hand.forEach((t,i)=>t.o=i);R.msg=""}
  }else if(msg.kind==="tray-to-slot"){
    const i=R.st.findIndex(t=>String(t.id)===id);if(i>=0&&Number.isInteger(Number(msg.slot))&&Number(msg.slot)>=0&&Number(msg.slot)<=7)moveTrayTileToSlot(i,Number(msg.slot));
  }else if(msg.kind==="tray-to-hand"){
    const i=R.st.findIndex(t=>String(t.id)===id);if(i>=0)unstage(i);
  }
}
function coopApplyOptimisticAction(action){
  if(!action||!R||G.mode!=="play"||R.lock||R.dv)return;
  const id=String(action.id);
  if(action.kind==="hand"){
    const i=R.hand.findIndex(t=>String(t.id)===id);if(i<0||R.st.length>=8)return;
    const pos=nextTraySlot();if(pos<0)return;
    R.lastScore=null;R.st.push(R.hand.splice(i,1)[0]);R.stPos.push(pos);sortStByPos();R.msg="";
  }else if(action.kind==="tray"){
    const i=R.st.findIndex(t=>String(t.id)===id);if(i<0)return;
    R.lastScore=null;R.hand.push(R.st.splice(i,1)[0]);R.stPos.splice(i,1);R.hand.sort((a,b)=>a.o-b.o);sortStByPos();
  }
}
function coopOptimisticCardAction(kind,id){
  if(!R||G.mode!=="play"||R.lock||R.dv)return false;
  const source=kind==="hand"?R.hand:R.st,index=source.findIndex(t=>String(t.id)===String(id));
  if(index<0||kind==="hand"&&(R.st.length>=8||nextTraySlot()<0))return false;
  const actionId=++COOP.actionSeq;
  if(!coopSend({type:"action",kind,id:String(id),actionId,optimistic:true}))return false;
  const action={actionId,kind,id:String(id),ackRev:null};COOP.optimisticActions.push(action);
  if(kind==="hand")stage(index);else unstage(index);
  return true;
}
function coopSendActionFromElement(el){
  if(!COOP.connected||COOP.role!=="guest"||!el)return false;
  if(COOP.dragLock&&COOP.dragLock.owner==="host"){COOP.modalNote="O outro jogador está arrastando uma carta.";coopUpdateStatus();return true}
  const d=el.dataset;
  if(d.a==="theme"||d.a==="mute")return false;
  if(d.h!==undefined){if(coopOptimisticCardAction("hand",String(d.id)))return true;return coopSend({type:"action",kind:"hand",id:String(d.id)})}
  if(d.s!==undefined){if(coopOptimisticCardAction("tray",String(d.id)))return true;return coopSend({type:"action",kind:"tray",id:String(d.id)})}
  if(d.dk!==undefined)return coopSend({type:"action",kind:"dk",value:Number(d.dk)});
  if(d.o!==undefined)return coopSend({type:"action",kind:"o",value:Number(d.o)});
  if(d.postit!==undefined)return coopSend({type:"action",kind:"postit",value:String(d.postit)});
  if(d.r!==undefined)return coopSend({type:"action",kind:"r",value:Number(d.r)});
  if(d.l!==undefined)return coopSend({type:"action",kind:"l",value:String(d.l)});
  if(d.a!==undefined)return coopSend({type:"action",kind:"a",value:String(d.a)});
  return false;
}
function coopBeginLocalDrag(d){
  if(!COOP.connected)return true;
  const owner=COOP.role,id=String(d.id);
  if(COOP.dragLock&&COOP.dragLock.owner!==owner){
    if(owner!=="host"){d.remoteRejected=true;return false}
    coopSend({type:"dragRejected",id:COOP.dragLock.id,reason:"O anfitrião iniciou um arrasto ao mesmo tempo; o anfitrião tem prioridade."});
    COOP.dragLock=null;coopClearRemoteDrag(false);
  }
  if(COOP.dragLock&&COOP.dragLock.owner===owner){if(String(COOP.dragLock.id)===id)return true;d.remoteRejected=true;return false}
  COOP.dragLock={owner,id,mode:d.mode};COOP.previewLastAt=0;clearTimeout(COOP.previewTimer);COOP.previewTimer=0;COOP.previewPending=null;coopSend({type:"dragStart",id,mode:d.mode});return true;
}
function coopPreviewPayload(d,e,target){
  const width=window.innerWidth||1,height=window.innerHeight||1;
  let area="screen",x=e.clientX/width,y=e.clientY/height;

      location.replace(location.pathname+"?v="+encodeURIComponent(m[1]));
    }).catch(()=>{});

})();
